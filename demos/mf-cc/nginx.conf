# mf-cc multi-user reverse proxy (path-based).
#
# Listens on 58881 and forwards to the atenet-router port-forward
# (127.0.0.1:58880). Each user is addressed by URL path:
#   http://<hostname>:58881/<username>
#
# Routing model:
#   * /<username>            -> set mfcc_user cookie, 302 to /<username>/
#   * /<username>/<rest...>  -> set cookie, strip /<username>, proxy with
#                               Host: <username>.mfcc.actors.resources.substrate.ate.dev
#   * /api/..., /ws/..., /assets/..., /health, ... (system paths) ->
#                               route by the mfcc_user cookie (the mf-cc web
#                               app issues these against the origin, so they
#                               carry no user id in the URL).
#
# IMPORTANT: the reserved-prefix regex location MUST be declared before the
# user-path regex locations — nginx uses the first matching regex in order.
#
# The atespace (`mfcc`) is hard-coded in the Host header below; change it if
# the demo uses a different atespace.
#
# NOTE: this file is copied verbatim into the mfcc-nginx image by the
# Dockerfile and is served by `run-nginx.sh`.

server {
    listen 58881 default_server;
    server_name _;

    # Landing page for the bare origin (no user id).
    location = / {
        default_type text/plain;
        return 200 "mf-cc multi-user proxy\n\nAccess a user via URL path:\n  http://<hostname>:58881/<username>\n\nExample: http://localhost:58881/alice\n";
    }

    # System paths (reserved prefixes): the app calls these origin-relative,
    # so route them back to the actor stored in the mfcc_user cookie.
    location ~ ^/(api|assets|ws|sdk|callback|auth|proxy|preview-fs|local-file|health)(/|$) {
        proxy_pass http://127.0.0.1:58880;
        proxy_set_header Host $cookie_mfcc_user.mfcc.actors.resources.substrate.ate.dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User entry: /<username> -> set cookie and normalize to /<username>/.
    location ~ ^/(?<username>[a-z0-9-]+)$ {
        add_header Set-Cookie "mfcc_user=$username; Path=/; HttpOnly; SameSite=Lax" always;
        return 302 /$username/$is_args$args;
    }

    # User-scoped path: /<username>/<rest...> -> set cookie, strip prefix, proxy.
    location ~ ^/(?<username>[a-z0-9-]+)/(?<rest>.*)$ {
        add_header Set-Cookie "mfcc_user=$username; Path=/; HttpOnly; SameSite=Lax" always;
        proxy_pass http://127.0.0.1:58880/$rest$is_args$args;
        proxy_set_header Host $username.mfcc.actors.resources.substrate.ate.dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback: favicon, /app-icon.svg, etc. -> route by cookie.
    location / {
        proxy_pass http://127.0.0.1:58880;
        proxy_set_header Host $cookie_mfcc_user.mfcc.actors.resources.substrate.ate.dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
