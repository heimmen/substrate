# mf-cc multi-user reverse proxy.
#
# Listens on 58881 and forwards to the atenet-router port-forward
# (127.0.0.1:58880). Each user is addressed by subdomain:
#   http://<username>.localhost:58881
# The nginx regex extracts the username and sets the actor Host header
# "<username>.mfcc.actors.resources.substrate.ate.dev", which the Substrate
# router resolves to that user's actor.
#
# The atespace (`mfcc`) is hard-coded in the Host header below; change it if
# the demo uses a different atespace.
#
# NOTE: this file is copied verbatim into the mfcc-nginx image by the
# Dockerfile and is served by `run-nginx.sh`.

server {
    listen 58881;
    server_name ~^(?<username>[a-z0-9-]+)\.localhost$;

    location / {
        proxy_pass http://127.0.0.1:58880;
        proxy_set_header Host $username.mfcc.actors.resources.substrate.ate.dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Fallback / landing page for bare `localhost` or `127.0.0.1`.
server {
    listen 58881 default_server;
    server_name localhost 127.0.0.1 _;

    location / {
        default_type text/plain;
        return 200 "mf-cc multi-user proxy\n\nAccess a user via subdomain:\n  http://<username>.localhost:58881\n\nExample: http://alice.localhost:58881\n";
    }
}
