# mf-cc multi-user reverse proxy (path-based) — TEST environment.
#
# Test-environment counterpart of nginx.conf. Listens on 59881 (prod: 58881),
# forwards to the atenet-router port-forward on 59880 and the mfcc-admin
# port-forward on 59882 (prod: 58880/58882), uses the mfcc_user_test cookie
# (prod: mfcc_user) and the mfcc-test atespace in the Host header (prod:
# mfcc). This file is bind-mounted over the image's baked-in conf by
# run-nginx-test.sh — it is NOT baked into the mfcc-nginx image.
#
# Each user is addressed by URL path:
#   http://<hostname>:59881/<username>
#
# Routing model:
#   * /<username>            -> set mfcc_user_test cookie, 302 to /<username>/
#   * /<username>/<rest...>  -> set cookie, strip /<username>, proxy with
#                               Host: <username>.mfcc-test.actors.resources.substrate.ate.dev
#   * /api/..., /ws/..., /assets/..., /health, ... (system paths) ->
#                               route by the mfcc_user_test cookie (the mf-cc
#                               web app issues these against the origin, so
#                               they carry no user id in the URL).
#   * /usermanagement/...      -> the mf-cc user-management UI (a separate
#                               pod behind a 59882 port-forward); NOT a user.
#
# Authentication model:
#   * /usermanagement/... is protected by fixed HTTP Basic Auth (auth_basic)
#     with credentials from /etc/nginx/mfcc-admin.htpasswd.
#   * /<username>/<rest...>, system paths and the fallback are protected by
#     auth_request /_mfcc_auth, which validates the per-user password against
#     the mfcc-admin app. Users with no assigned password are denied until the
#     admin generates one via the management UI.
#
# NOTE: auth_request runs in the access phase, but `return` runs in the
# rewrite phase (earlier), so the /<username> entry redirect (which only 302s
# into the protected /<username>/ path) intentionally has NO auth_request.
#
# IMPORTANT: the reserved-prefix regex location MUST be declared before the
# user-path regex locations — nginx uses the first matching regex in order.
# The `^~ /usermanagement/` prefix location wins over every regex location
# regardless of order. `usermanagement` is a reserved path and cannot be a
# username.
#
# The atespace (`mfcc-test`) is hard-coded in the Host header below; change it
# if the test demo uses a different atespace.

server {
    listen 59881 default_server;
    server_name _;

    # Landing page for the bare origin (no user id).
    location = / {
        default_type text/plain;
        return 200 "mf-cc multi-user proxy (TEST)\n\nAccess a user via URL path:\n  http://<hostname>:59881/<username>\n\nExample: http://localhost:59881/alice\n\nUser management UI:\n  http://<hostname>:59881/usermanagement/\n";
    }

    # Internal auth subrequest: validates the per-user password for agent-page
    # access. It proxies to the mfcc-admin app's /_mfcc_auth endpoint, passing
    # the original URI and the mfcc_user_test cookie so the app can resolve the
    # target user. Declared before the user-path regex locations for clarity
    # (exact match has highest priority regardless).
    location = /_mfcc_auth {
        internal;
        proxy_pass http://127.0.0.1:59882/_mfcc_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Mfcc-User $cookie_mfcc_user_test;
        proxy_set_header Authorization $http_authorization;
    }

    # User-management UI: a separate app pod (port-forward 59882), NOT a
    # user path. The trailing "/" in proxy_pass strips the /usermanagement/
    # prefix so the app sees /api/users, /, etc. Protected by a fixed Basic
    # Auth credential (see run-nginx-test.sh / Dockerfile for the htpasswd
    # file).
    location ^~ /usermanagement/ {
        auth_basic "mfcc admin";
        auth_basic_user_file /etc/nginx/mfcc-admin.htpasswd;
        proxy_pass http://127.0.0.1:59882/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # System paths (reserved prefixes): the app calls these origin-relative,
    # so route them back to the actor stored in the mfcc_user_test cookie.
    # These carry the same Basic credentials the browser sent for the user
    # page.
    location ~ ^/(api|assets|ws|sdk|callback|auth|proxy|preview-fs|local-file|health)(/|$) {
        auth_request /_mfcc_auth;
        proxy_pass http://127.0.0.1:59880;
        proxy_set_header Host $cookie_mfcc_user_test.mfcc-test.actors.resources.substrate.ate.dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User entry: /<username> -> set cookie and normalize to /<username>/.
    location ~ ^/(?<username>[a-z0-9-]+)$ {
        add_header Set-Cookie "mfcc_user_test=$username; Path=/; HttpOnly; SameSite=Lax" always;
        return 302 /$username/$is_args$args;
    }

    # User-scoped path: /<username>/<rest...> -> set cookie, strip prefix, proxy.
    location ~ ^/(?<username>[a-z0-9-]+)/(?<rest>.*)$ {
        auth_request /_mfcc_auth;
        add_header Set-Cookie "mfcc_user_test=$username; Path=/; HttpOnly; SameSite=Lax" always;
        proxy_pass http://127.0.0.1:59880/$rest$is_args$args;
        proxy_set_header Host $username.mfcc-test.actors.resources.substrate.ate.dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback: favicon, /app-icon.svg, etc. -> route by cookie.
    location / {
        auth_request /_mfcc_auth;
        proxy_pass http://127.0.0.1:59880;
        proxy_set_header Host $cookie_mfcc_user_test.mfcc-test.actors.resources.substrate.ate.dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
