# mf-pi multi-user reverse proxy (path-based).
#
# Listens on 58681 and forwards to the atenet-router port-forward
# (127.0.0.1:58680). Each user is addressed by URL path:
#   http://<hostname>:58681/<username>
#
# Routing model:
#   * /<username>            -> set mfpi_user cookie, 302 to /<username>/
#   * /<username>/<rest...>  -> set cookie, strip /<username>, proxy with
#                               Host: <username>.mfpi.actors.resources.substrate.ate.dev
#   * /usermanagement/...    -> the mf-pi user-management UI (a separate pod
#                               behind a 58682 port-forward); NOT a user.
#   * anything else          -> fallback routed by the mfpi_user cookie
#                               (favicon etc.).
#
# Unlike mf-cc, no system-path regex location is needed: the pi-web frontend
# resolves every request (API under /api/..., plugin assets under
# /pi-web-plugins/..., and all WebSockets) against the /<username>/ base it
# was loaded from (vite base "./" + resolveAppUrl), so user-scoped traffic
# always carries the /<username>/ prefix.
#
# Authentication model:
#   * /usermanagement/... is protected by fixed HTTP Basic Auth (auth_basic)
#     with credentials from /etc/nginx/mfpi-admin.htpasswd.
#   * /<username>/<rest...> and the fallback are protected by
#     auth_request /_mfpi_auth, which validates the per-user password against
#     the mfpi-admin app. Users with no assigned password are denied until
#     the admin generates one via the management UI.
#
# NOTE: auth_request runs in the access phase, but `return` runs in the
# rewrite phase (earlier), so the /<username> entry redirect (which only 302s
# into the protected /<username>/ path) intentionally has NO auth_request.
#
# IMPORTANT: the `^~ /usermanagement/` prefix location wins over every regex
# location regardless of order. `usermanagement` is a reserved path and
# cannot be a username.
#
# The atespace (`mfpi`) is hard-coded in the Host header below; change it if
# the demo uses a different atespace.
#
# NOTE: this file is copied verbatim into the mfpi-nginx image by the
# Dockerfile and is served by `run-nginx.sh`.

server {
    listen 58681 default_server;
    server_name _;

    # Landing page for the bare origin (no user id).
    location = / {
        default_type text/plain;
        return 200 "mf-pi multi-user proxy\n\nAccess a user via URL path:\n  http://<hostname>:58681/<username>\n\nExample: http://localhost:58681/alice\n\nUser management UI:\n  http://<hostname>:58681/usermanagement/\n";
    }

    # Internal auth subrequest: validates the per-user password for agent-page
    # access. It proxies to the mfpi-admin app's /_mfpi_auth endpoint, passing
    # the original URI and the mfpi_user cookie so the app can resolve the
    # target user. Declared before the user-path regex locations for clarity
    # (exact match has highest priority regardless).
    location = /_mfpi_auth {
        internal;
        proxy_pass http://127.0.0.1:58682/_mfpi_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Mfpi-User $cookie_mfpi_user;
        proxy_set_header Authorization $http_authorization;
    }

    # Readiness gate: an auth subrequest that also refuses (403) while the
    # actor is not RUNNING. Unlike /_mfpi_auth it wakes a suspended actor in
    # the background and answers immediately, so the loading page can be shown
    # without waiting for the router's (multi-second) blocking resume.
    location = /_mfpi_gate {
        internal;
        proxy_pass http://127.0.0.1:58682/_mfpi_gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Mfpi-User $cookie_mfpi_user;
        proxy_set_header Authorization $http_authorization;
    }

    # User-management UI: a separate app pod (port-forward 58682), NOT a
    # user path. The trailing "/" in proxy_pass strips the /usermanagement/
    # prefix so the app sees /api/users, /, etc. Protected by a fixed Basic
    # Auth credential (see run-nginx.sh / Dockerfile for the htpasswd file).
    location ^~ /usermanagement/ {
        auth_basic "mfpi admin";
        auth_basic_user_file /etc/nginx/mfpi-admin.htpasswd;
        proxy_pass http://127.0.0.1:58682/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User entry: /<username> -> set cookie and normalize to /<username>/.
    location ~ ^/(?<username>[a-z0-9-]+)$ {
        add_header Set-Cookie "mfpi_user=$username; Path=/; HttpOnly; SameSite=Lax" always;
        return 302 /$username/$is_args$args;
    }

    # User-scoped path: /<username>/<rest...> -> set cookie, strip prefix,
    # proxy. This covers every pi-web request: the SPA index, static assets,
    # /api/..., /pi-web-plugins/... and all WebSocket upgrades, because the
    # frontend resolves them against the /<username>/ base.
    #
    # /_mfpi_gate refuses (403) while the actor is not RUNNING; that 403 is
    # turned into the "agent is loading" page for browsers, and into a raw 503
    # for API/WebSocket clients (see /_mfpi_loading). While the actor is
    # RUNNING but its web server is still booting, upstream 502/503/504 are
    # mapped the same way.
    location ~ ^/(?<username>[a-z0-9-]+)/(?<rest>.*)$ {
        auth_request /_mfpi_gate;
        add_header Set-Cookie "mfpi_user=$username; Path=/; HttpOnly; SameSite=Lax" always;
        proxy_intercept_errors on;
        error_page 403 502 503 504 = /_mfpi_loading;
        proxy_pass http://127.0.0.1:58680/$rest$is_args$args;
        proxy_set_header Host $username.mfpi.actors.resources.substrate.ate.dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Loading interstitial target (reached only via error_page above). Serves
    # the friendly page for browsers, and the original 503 for everything else
    # so API/WebSocket clients see the truth.
    location = /_mfpi_loading {
        internal;
        if ($http_accept !~* "text/html") {
            return 503;
        }
        proxy_pass http://127.0.0.1:58682/_mfpi_loading;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Mfpi-User $cookie_mfpi_user;
    }

    # Fallback: favicon, /app-icon.svg, etc. -> route by cookie.
    location / {
        auth_request /_mfpi_auth;
        proxy_pass http://127.0.0.1:58680;
        proxy_set_header Host $cookie_mfpi_user.mfpi.actors.resources.substrate.ate.dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
