# Placeholder config baked into the mfpi-nginx image.
#
# The image is intentionally environment-agnostic: run-nginx.sh bind-mounts
# env/<env>.env's MFPI_NGINX_CONF (nginx-prod.conf / nginx-qa.conf /
# nginx-test.conf) over this file and its htpasswd over the baked-in one.
#
# If you see this response, the gateway container was started without a
# configuration mount (do not run the image directly; use run-nginx*.sh).
server {
    listen 80 default_server;
    server_name _;

    location / {
        default_type text/plain;
        return 503 "mf-pi gateway: no environment configuration mounted\n";
    }
}
