<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>mf-pi 用户管理</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e2e5ea;
    --text: #1f2329;
    --muted: #6b7280;
    --accent: #2563eb;
    --danger: #dc2626;
    --green: #16a34a;
    --green-bg: #dcfce7;
    --gray: #6b7280;
    --gray-bg: #f3f4f6;
    --blue: #2563eb;
    --blue-bg: #dbeafe;
    --red: #dc2626;
    --red-bg: #fee2e2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .container {
    width: 100%;
    max-width: 100%;
    margin: 24px auto;
    padding: 0 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 20px;
    overflow-x: auto;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  form { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
  }
  input[type="file"] {
    padding: 8px 4px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    color: var(--text);
    background: #fff;
  }
  input[type="file"]::file-selector-button {
    background: #eef0f3;
    color: var(--text);
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    margin-right: 8px;
    cursor: pointer;
  }
  input[type="file"]::file-selector-button:hover { background: #e2e5ea; }
  button {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  button.secondary { background: #eef0f3; color: var(--text); }
  button.danger { background: var(--danger); }
  button.mini { padding: 4px 10px; font-size: 13px; }
  #msg {
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 12px;
    font-size: 14px;
    display: none;
  }
  #msg.ok { display: block; background: var(--green-bg); color: var(--green); }
  #msg.err { display: block; background: var(--red-bg); color: var(--red); }
  table { width: 100%; min-width: 960px; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  td.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
  td.actions { white-space: nowrap; }
  td a, td a:visited { color: var(--accent); text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .dropdown { position: relative; display: inline-block; }
  .dropdown-toggle {
    padding: 4px 10px;
    font-size: 13px;
    background: #eef0f3;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
  }
  .dropdown-toggle:hover { background: #e2e5ea; }
  .dropdown-menu {
    position: fixed;
    min-width: 140px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    z-index: 1000;
    padding: 4px;
    display: none;
  }
  .dropdown.open .dropdown-menu { display: block; }
  .dropdown-menu button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 8px 12px;
    font-size: 13px;
    border: none;
    background: transparent;
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
  }
  .dropdown-menu button:hover { background: var(--gray-bg); }
  .dropdown-menu button.danger { color: var(--danger); }
  .dropdown-menu button.danger:hover { background: var(--red-bg); }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.green { background: var(--green-bg); color: var(--green); }
  .badge.gray { background: var(--gray-bg); color: var(--gray); }
  .badge.blue { background: var(--blue-bg); color: var(--blue); }
  .badge.red { background: var(--red-bg); color: var(--red); }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
  #empty { color: var(--muted); text-align: center; padding: 24px 0; }
  /* 设置 API Key 对话框：遮罩 + 居中面板，关闭时整体从 DOM 移除。 */
  .modal-overlay {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    background: rgba(15, 23, 42, 0.45);
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal {
    background: var(--card);
    border-radius: 8px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.2);
    padding: 16px;
    width: 100%;
    max-width: 420px;
  }
  .modal-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .modal-label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .modal select, .modal input[type="text"] {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    background: #fff;
    color: var(--text);
    margin-bottom: 12px;
  }
  .modal select:disabled { color: var(--muted); }
  .modal-note, .modal-hint { font-size: 12px; color: var(--muted); margin: -4px 0 12px; }
  .modal-error { font-size: 13px; color: var(--danger); margin: -4px 0 8px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  /* 自定义模型端点管理器：比 Key 对话框宽，内容超高时整体滚动。 */
  .modal.endpoint-modal { max-width: 560px; max-height: 90vh; overflow-y: auto; }
  .modal textarea {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
    margin-bottom: 12px;
    resize: vertical;
    min-height: 64px;
  }
  .endpoint-list { max-height: 200px; overflow-y: auto; margin-bottom: 12px; }
  .endpoint-item {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .endpoint-item .endpoint-name { font-size: 14px; font-weight: 600; }
  .endpoint-item .endpoint-meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
    word-break: break-all;
  }
  .endpoint-item .endpoint-meta code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--gray-bg);
    border-radius: 4px;
    padding: 1px 4px;
  }
  .endpoint-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 12px 0; }
  /* 模型设置对话框：标签页（模型端点 / 用户 API Key）。两个面板始终保留在 DOM 中，
     切换只改 hidden —— 「模型端点」表单里已填的草稿不会因为切标签而丢失。 */
  .tab-strip {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .tab-strip .tab {
    background: transparent;
    color: var(--muted);
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    padding: 8px 12px;
    font-size: 14px;
  }
  .tab-strip .tab:hover { color: var(--text); }
  .tab-strip .tab[aria-selected="true"] {
    color: var(--accent);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }
  .tab-panel[hidden] { display: none; }
  .modal-hint code, .modal-note code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--gray-bg);
    border-radius: 4px;
    padding: 1px 4px;
  }
  /* 模型目录：一行一个模型卡片，容量/输入类型可折叠；候选勾选对话框独立于管理器。 */
  .endpoint-section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  .endpoint-section-head .modal-label { margin-bottom: 0; }
  .endpoint-rows { margin-bottom: 8px; }
  .endpoint-rows-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .endpoint-rows-actions .modal-hint { margin: 0; }
  .model-row {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 8px;
    background: #fff;
  }
  .model-row-head { display: flex; align-items: center; gap: 6px; }
  .modal .model-row-head input[type="text"] {
    flex: 1 1 0;
    min-width: 0;
    margin-bottom: 0;
    padding: 6px 8px;
    font-size: 13px;
  }
  .modal .model-row-body input[type="text"] {
    margin-bottom: 0;
    padding: 6px 8px;
    font-size: 13px;
  }
  .model-row-body { margin-top: 8px; }
  .model-grid { display: flex; gap: 8px; margin-bottom: 8px; }
  .model-grid > div { flex: 1 1 0; min-width: 0; }
  .model-input-types { display: flex; gap: 16px; font-size: 13px; margin-bottom: 4px; }
  .model-input-types label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .model-row .model-row-error { margin: 6px 0 0; }
  .model-picker-modal { max-width: 520px; }
  .model-picker-list {
    max-height: 300px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px;
    margin-bottom: 12px;
  }
  .model-picker-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .model-picker-item:hover { background: var(--gray-bg); }
  .model-picker-item.disabled { opacity: 0.55; cursor: not-allowed; }
  .model-picker-item code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    word-break: break-all;
  }
  .model-picker-item .model-picker-name { color: var(--muted); }
  .model-picker-item .model-picker-tag {
    margin-left: auto;
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }
  .model-picker-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .model-picker-toolbar .modal-hint { margin: 0; }
  .model-picker-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 12px 0; }
</style>
</head>
<body>
<header>
  <div>
    <h1>mf-pi 用户管理</h1>
    <div class="sub" id="atespace-info">正在加载 atespace 信息…</div>
  </div>
  <div class="toolbar" style="margin-bottom: 0">
    <button class="secondary" id="model-settings-btn"
            title="模型设置的唯一入口：维护部署级端点（Base URL + 模型名）并为单个用户设置专属 API Key">模型设置</button>
    <button class="secondary" id="refresh-btn">刷新</button>
  </div>
</header>

<div class="container">
  <div id="msg"></div>

  <div class="card">
    <h2>添加用户</h2>
    <form id="add-form">
      <input type="text" id="name-input" placeholder="用户名（DNS-1123：小写字母、数字、中划线）"
             autocomplete="off" spellcheck="false" />
      <button type="submit">添加</button>
    </form>
  </div>

  <div class="card" id="skills-card">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
      <div>
        <h2 style="margin-bottom:2px">共享 Skills</h2>
        <div class="sub" style="color:var(--muted); font-size:13px;">
          管理员托管的 skill，自动分发到所有用户；每 10 秒同步，支持 .tgz / .zip
        </div>
      </div>
      <div id="apply-wrap" style="display:flex; gap:8px; align-items:center;">
        <span id="apply-note" class="sub" style="color:var(--muted); font-size:13px;"></span>
        <button class="secondary" id="apply-skills-btn" title="向所有运行中的用户扇出 reload，让已打开的会话立即可用新 skill">立即应用</button>
      </div>
    </div>

    <form id="skill-upload-form" style="margin-top:12px; flex-wrap:wrap;">
      <input type="text" id="skill-name-input" placeholder="skill 名称（小写字母/数字/中划线）" autocomplete="off" spellcheck="false"
             style="flex:0 1 260px;" />
      <input type="file" id="skill-file-input" accept=".tgz,.tar.gz,.zip" style="flex:1 1 220px;" />
      <button type="submit" id="skill-upload-btn">上传</button>
    </form>

    <div id="skill-empty" style="display:none; color:var(--muted); text-align:center; padding:20px 0;">
      尚未托管任何 skill
    </div>
    <table id="skill-table" style="display:none; min-width:640px;">
      <thead>
        <tr>
          <th>名称</th>
          <th>大小</th>
          <th>更新时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="skill-body"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>用户列表</h2>
    <div id="empty" style="display:none">暂无用户</div>
    <table id="user-table" style="display:none">
      <thead>
        <tr>
          <th>名称</th>
          <th>状态</th>
          <th>API Key</th>
          <th>模板</th>
          <th>ATEOM Pod</th>
          <th>IP</th>
          <th>版本</th>
          <th>年龄</th>
          <th>有效期</th>
          <th>档位</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="user-body"></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  "use strict";

  var atespace = null;

  // openMenuUser 记录当前展开的用户操作菜单对应的用户名。用户列表每 5 秒
  // 自动刷新并重建 <tbody>，若不记录并在重建后恢复，正在操作的菜单会被
  // 下一次刷新"自己弄消失"（表现为 hover 菜单时菜单突然消失）。
  var openMenuUser = null;

  function showMsg(text, isErr) {
    var el = document.getElementById("msg");
    el.className = isErr ? "err" : "ok";
    el.textContent = text;
  }

  function clearMsg() {
    document.getElementById("msg").className = "";
    document.getElementById("msg").textContent = "";
  }

  function badgeClass(status) {
    if (status === "STATUS_RUNNING") return "green";
    if (status === "STATUS_SUSPENDED") return "gray";
    if (status === "STATUS_SUSPENDING" || status === "STATUS_PAUSING" ||
        status === "STATUS_RESUMING") return "blue";
    if (status === "STATUS_CRASHED") return "red";
    return "gray";
  }

  function statusLabel(status) {
    var labels = {
      STATUS_RUNNING: "运行中",
      STATUS_SUSPENDED: "已挂起",
      STATUS_SUSPENDING: "挂起中",
      STATUS_PAUSING: "暂停中",
      STATUS_PAUSED: "已暂停",
      STATUS_RESUMING: "恢复中",
      STATUS_CRASHED: "崩溃"
    };
    return labels[status] || status;
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // providersCache 缓存 GET api/providers 的结果（首次成功后复用，自动刷新不会
  // 覆盖它）；providersPromise 去重并发请求，避免对话框与页面加载各拉一次。
  var providersCache = null;
  var providersPromise = null;
  // 拉取失败时的兜底 provider：至少让管理员仍能完成用户 API Key 的设置。
  var fallbackProviders = [{ id: "deepseek", name: "DeepSeek" }];

  // fetchProviders 返回 provider 列表（{id,name} 数组）的 Promise；成功后缓存，
  // 失败则回退到 fallbackProviders 并允许下次重试。
  function fetchProviders() {
    if (providersCache) {
      return Promise.resolve(providersCache);
    }
    if (providersPromise) {
      return providersPromise;
    }
    providersPromise = fetch("api/providers")
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (data) {
        var list = (data && data.providers) || [];
        providersCache = list.length ? list : fallbackProviders;
        return providersCache;
      })
      .catch(function () {
        // 失败不缓存，下次调用可重试；本次用兜底列表继续。
        providersPromise = null;
        return fallbackProviders;
      });
    return providersPromise;
  }

  // refreshProviders 主动失效 provider 缓存并重新拉取：新增/删除自定义端点后调用，
  // 使端点列表与「用户 API Key」标签页的 provider 下拉立即看到变更。
  function refreshProviders() {
    providersCache = null;
    providersPromise = null;
    return fetchProviders();
  }

  // providerDisplayName 把 provider id 解析为展示名；未加载或未知 id 时原样返回 id。
  function providerDisplayName(id) {
    if (!id) return "";
    if (providersCache) {
      for (var i = 0; i < providersCache.length; i++) {
        if (providersCache[i].id === id) return providersCache[i].name;
      }
    }
    return id;
  }

  // listProviders 页面加载时预取一次 provider 列表；就绪后重绘用户表，使 Key 徽标
  // 立即可显示展示名（而不是 provider id）。
  function listProviders() {
    fetchProviders().then(function () {
      if (atespace !== null) listUsers();
    });
  }

  // expiryDisplayHtml renders the 有效期 column: "—" when unset, "已到期" when
  // a RUNNING actor is past its expiry (auto-suspend pending), else the raw
  // RFC3339 timestamp.
  function expiryDisplayHtml(u) {
    if (!u.hasExpiry || !u.expiry) {
      return '<span class="badge gray">—</span>';
    }
    if (u.status === "STATUS_RUNNING" && new Date(u.expiry).getTime() < Date.now()) {
      return '<span class="badge red" title="激活有效期已到（' + esc(u.expiry) + '），将由后台自动挂起释放资源">已到期</span>';
    }
    return '<span class="badge gray" title="激活有效期（到期后自动挂起释放资源，可恢复）">' + esc(u.expiry) + "</span>";
  }

  function closeAllDropdowns() {
    document.querySelectorAll(".dropdown.open").forEach(function (d) {
      d.classList.remove("open");
    });
  }

  // positionDropdown 使用 fixed 定位并依据按钮位置计算坐标，避免被 .card
  // 的 overflow-x:auto 裁剪（短列表时下拉会超出卡片底部被截掉）。
  function positionDropdown(toggle, menu) {
    var rect = toggle.getBoundingClientRect();
    var mw = menu.offsetWidth;
    var mh = menu.offsetHeight;
    var left = rect.right - mw;
    var top = rect.bottom + 4;
    // 下方空间不足时向上弹出。
    if (top + mh > window.innerHeight - 8) {
      top = rect.top - mh - 4;
    }
    // 超出左边界时夹紧到可视区内。
    if (left < 8) left = 8;
    menu.style.left = left + "px";
    menu.style.top = top + "px";
  }

  function openUserMenu(toggle) {
    var dropdown = toggle.parentElement;
    var menu = dropdown.querySelector(".dropdown-menu");
    closeAllDropdowns();
    dropdown.classList.add("open");
    openMenuUser = toggle.getAttribute("data-user");
    positionDropdown(toggle, menu);
  }

  function renderUsers(users) {
    var table = document.getElementById("user-table");
    var empty = document.getElementById("empty");
    var body = document.getElementById("user-body");
    // 记住刷新前展开的菜单，重建后按用户名恢复，避免自动刷新把用户正在
    // 操作的菜单关掉（重建期间统一清空 openMenuUser，恢复时再写回）。
    var prevOpenUser = openMenuUser;
    openMenuUser = null;
    body.innerHTML = "";

    if (!users || users.length === 0) {
      table.style.display = "none";
      empty.style.display = "block";
      return;
    }
    table.style.display = "table";
    empty.style.display = "none";

    users.forEach(function (u) {
      var tr = document.createElement("tr");
      // 用户名链接到对应的 agent 页面：http://<hostname>:58681/<username>/
      var agentUrl = window.location.origin + "/" + encodeURIComponent(u.name) + "/";
      // Key 徽标：显示该用户已存储 Key 的 provider 展示名，未设置则显示灰色未设置。
      var keyProviderId = u.personalKeyProvider || "";
      var keyProviderName = providerDisplayName(keyProviderId);
      var keyBadge = u.hasPersonalKey ?
        '<span class="badge green" title="' + esc(keyProviderName ?
          "已为该用户存储 " + keyProviderName + " 的专属 API Key" :
          "已为该用户存储专属 API Key") + '">' +
        esc(keyProviderName || "已设置") + "</span>" :
        '<span class="badge gray" title="未存储专属 Key，agent 将使用内置/环境变量凭据">未设置</span>';
      var expiryCell = expiryDisplayHtml(u);
      var tierBadge = u.tier ?
        '<span class="badge blue" title="该用户的资源档位（作用于新建/重建，存量用户不变）">' + esc(u.tier) + "</span>" :
        '<span class="badge gray">—</span>';
      tr.innerHTML =
        '<td class="mono"><a href="' + esc(agentUrl) + '" target="_blank" rel="noopener" title="打开 agent 页面">' + esc(u.name) + "</a></td>" +
        '<td><span class="badge ' + badgeClass(u.status) + '">' + esc(statusLabel(u.status)) + "</span></td>" +
        '<td>' + keyBadge + "</td>" +
        '<td class="mono">' + esc(u.template) + "</td>" +
        '<td class="mono">' + esc(u.ateomPod) + "</td>" +
        '<td class="mono">' + esc(u.ip) + "</td>" +
        "<td>" + esc(u.version) + "</td>" +
        "<td>" + esc(u.age) + "</td>" +
        "<td>" + expiryCell + "</td>" +
        "<td>" + tierBadge + "</td>" +
        '<td class="actions"><div class="dropdown">' +
        '<button class="dropdown-toggle" data-user="' + esc(u.name) + '">操作 ▾</button>' +
        '<div class="dropdown-menu">' +
        '<button class="copy-pwd">复制密码</button>' +
        '<button class="reset-pwd">重置密码</button>' +
        '<button class="set-expiry" title="设置激活有效期，到期后自动挂起释放资源">设置有效期</button>' +
        '<button class="clear-expiry" title="撤销激活有效期，停止到期自动挂起">清除有效期</button>' +
        '<button class="set-tier" title="设置用户资源档位（新建/重建后生效）">设置资源档位</button>' +
        '<button class="danger del">删除</button>' +
        "</div></div></td>";
      tr.querySelector(".dropdown-toggle").addEventListener("click", function (e) {
        e.stopPropagation();
        var dropdown = this.parentElement;
        var wasOpen = dropdown.classList.contains("open");
        // 再次点击已展开的按钮则收起。
        if (wasOpen) {
          dropdown.classList.remove("open");
          openMenuUser = null;
          return;
        }
        // openUserMenu 会关闭其它已打开的菜单（避免多个同时显示）并记录
        // 当前用户名，供自动刷新后恢复。
        openUserMenu(this);
      });
      tr.querySelector(".copy-pwd").addEventListener("click", function () {
        copyPassword(u.name);
      });
      tr.querySelector(".reset-pwd").addEventListener("click", function () {
        resetPassword(u.name);
      });
      tr.querySelector(".set-expiry").addEventListener("click", function () {
        setUserExpiry(u.name);
      });
      tr.querySelector(".clear-expiry").addEventListener("click", function () {
        clearUserExpiry(u.name);
      });
      tr.querySelector(".set-tier").addEventListener("click", function () {
        setUserTier(u.name, u.tier);
      });
      tr.querySelector(".del").addEventListener("click", function () {
        deleteUser(u.name);
      });
      body.appendChild(tr);
      // 该用户的菜单在刷新前是展开的：行已重建并挂到 DOM，重新展开并定位，
      // 使用户正在操作的菜单不会因自动刷新而消失。
      if (u.name === prevOpenUser) {
        openUserMenu(tr.querySelector(".dropdown-toggle"));
      }
    });
  }

  function listUsers() {
    fetch("api/users")
      .then(function (res) {
        if (!res.ok) {
          return res.json().then(function (j) {
            throw new Error((j && j.error) || ("HTTP " + res.status));
          });
        }
        return res.json();
      })
      .then(function (data) {
        atespace = data.atespace;
        document.getElementById("atespace-info").textContent =
          "atespace: " + esc(data.atespace) + " · 每 5 秒自动刷新";
        renderUsers(data.users);
      })
      .catch(function (err) {
        showMsg("列出用户失败：" + err.message, true);
      });
  }

  function deleteUser(name) {
    if (!window.confirm("确认删除用户 \"" + name + "\"？actor 及其本地会话历史将删除；" +
        "用户数据保留在持久卷上（重新创建该用户后自动恢复）。")) {
      return;
    }
    clearMsg();
    fetch("api/users/" + encodeURIComponent(name), { method: "DELETE" })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("删除成功：" + (j.message || name));
        listUsers();
      })
      .catch(function (err) {
        showMsg("删除失败：" + err.message, true);
      });
  }

  // submitUserAPIKey 提交 {apiKey, providerId}（「用户 API Key」标签页的唯一提交路径），
  // 沿用原有的成功/失败提示。done 是可选回调：成功后调用，让标签页刷新用户下拉与提示。
  function submitUserAPIKey(name, key, providerId, done) {
    clearMsg();
    fetch("api/users/" + encodeURIComponent(name) + "/apikey", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ apiKey: key, providerId: providerId })
    })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("用户 " + esc(j.name || name) + "：" + (j.message || "API Key 已设置"));
        listUsers();
        if (done) done();
      })
      .catch(function (err) {
        showMsg("设置 Key 失败：" + err.message, true);
      });
  }

  // ---- 模型设置（唯一入口：标签页「模型端点」/「用户 API Key」） ----

  // modelSettingsEl 记录当前打开的"模型设置"对话框根节点（含遮罩）。每次打开新建、
  // 关闭时整体从 DOM 移除，因此 5 秒自动刷新（只重建用户表 <tbody>）既不会干扰它，
  // 也不会把它重新"复活"。
  var modelSettingsEl = null;

  // ENDPOINT_ID_HINT 是 Provider ID 的常驻提示；id 非法时会被同位置的内联错误替换。
  var ENDPOINT_ID_HINT = "留空则由显示名自动生成；需匹配 ^[a-z0-9][a-z0-9._-]*$，不能与内置或已有端点重名。";

  // customEndpointDetails 记录本次会话内新增端点的 baseUrl/api/models 明细。
  // GET api/providers 对 custom 端点已返回 baseUrl/api/models；本地记录仅作为
  // 兜底（后端未返回时），让刚添加的端点在列表里立即显示完整信息。
  var customEndpointDetails = {};

  // closeModelSettings 关闭对话框（若已打开）并注销 Esc 监听；叠在上面的"选择模型"
  // 对话框一并关闭，避免留下孤立的遮罩层。
  function closeModelSettings() {
    closeModelPicker();
    if (modelSettingsEl && modelSettingsEl.parentNode) {
      modelSettingsEl.parentNode.removeChild(modelSettingsEl);
    }
    modelSettingsEl = null;
    document.removeEventListener("keydown", onModelSettingsKeydown, true);
  }

  // onModelSettingsKeydown 支持 Esc 关闭模型设置对话框；若"选择模型"对话框正叠在上面，
  // Esc 只关它，对话框与已填内容保持不变。
  function onModelSettingsKeydown(e) {
    if (e.key === "Escape" || e.keyCode === 27) {
      if (modelPickerEl) {
        closeModelPicker();
        return;
      }
      closeModelSettings();
    }
  }

  // modelPickerEl 记录当前打开的"选择要添加的模型"对话框根节点（含遮罩）。与其它
  // 对话框一样：每次打开新建、关闭时整体从 DOM 移除，5 秒自动刷新不会干扰它。
  var modelPickerEl = null;

  // closeModelPicker 关闭"选择模型"对话框（若已打开）并注销 Esc 监听。
  function closeModelPicker() {
    if (modelPickerEl && modelPickerEl.parentNode) {
      modelPickerEl.parentNode.removeChild(modelPickerEl);
    }
    modelPickerEl = null;
    document.removeEventListener("keydown", onModelPickerKeydown, true);
  }

  // onModelPickerKeydown 支持 Esc 关闭"选择模型"对话框。
  function onModelPickerKeydown(e) {
    if (e.key === "Escape" || e.keyCode === 27) {
      closeModelPicker();
    }
  }

  // openModelPicker 打开候选模型勾选对话框：搜索框按 id/name 忽略大小写过滤，全选 /
  // 取消全选只作用于当前可见行；确认后回调 onAdd(selected) 由调用方追加表单行。
  // existingIds 里的模型在表单里已存在，显示为不可勾选，避免"采纳"覆盖管理员调过的行。
  function openModelPicker(candidates, existingIds, onAdd) {
    closeModelPicker();
    var root = document.createElement("div");
    root.className = "modal-overlay";
    root.innerHTML =
      '<div class="modal model-picker-modal" role="dialog" aria-modal="true" aria-label="选择要添加的模型">' +
      '<div class="modal-title">选择要添加的模型</div>' +
      '<input type="text" id="model-picker-search" placeholder="搜索模型" autocomplete="off" spellcheck="false" />' +
      '<div class="model-picker-toolbar">' +
      '<button class="secondary mini" id="model-picker-all">全选</button>' +
      '<button class="secondary mini" id="model-picker-none">取消全选</button>' +
      '<span class="modal-hint" id="model-picker-count"></span>' +
      "</div>" +
      '<div class="model-picker-list" id="model-picker-list"></div>' +
      '<div class="modal-actions">' +
      '<button class="secondary" id="model-picker-cancel">取消</button>' +
      '<button id="model-picker-ok">添加所选</button>' +
      "</div></div>";

    var list = root.querySelector("#model-picker-list");
    var search = root.querySelector("#model-picker-search");
    var countEl = root.querySelector("#model-picker-count");
    var okBtn = root.querySelector("#model-picker-ok");

    // 每个候选一行：原始 id 用等宽字体 + 展示名；候选对象按 id 存进 byId 供确认时取回。
    var byId = {};
    var items = [];
    candidates.forEach(function (m) {
      var id = m.id || "";
      if (id === "") return;
      byId[id] = m;
      var item = document.createElement("label");
      item.className = "model-picker-item";
      item.setAttribute("data-search", (id + " " + (m.name || "")).toLowerCase());
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.value = id;
      if (existingIds && existingIds[id]) {
        cb.disabled = true; // 表单里已有该模型：不勾选，也不允许覆盖
        item.className += " disabled";
      }
      item.appendChild(cb);
      var code = document.createElement("code");
      code.textContent = id;
      item.appendChild(code);
      var nameEl = document.createElement("span");
      nameEl.className = "model-picker-name";
      nameEl.textContent = m.name || id;
      item.appendChild(nameEl);
      if (cb.disabled) {
        // 明确说明为何不能勾选，避免管理员以为是界面故障。
        var tag = document.createElement("span");
        tag.className = "model-picker-tag";
        tag.textContent = "已在表单中";
        item.appendChild(tag);
      }
      cb.addEventListener("change", updatePickerState);
      list.appendChild(item);
      items.push(item);
    });

    // 搜索无结果时的占位（放在行尾，不参与 items 统计）。
    var emptyEl = document.createElement("div");
    emptyEl.className = "model-picker-empty";
    emptyEl.textContent = "没有匹配的模型";
    emptyEl.style.display = "none";
    list.appendChild(emptyEl);

    function visibleItems() {
      return items.filter(function (it) {
        return it.style.display !== "none";
      });
    }

    // updatePickerState 刷新候选计数与"添加所选"可用性（没勾选任何行时禁用）。
    function updatePickerState() {
      var checked = 0;
      items.forEach(function (it) {
        if (it.querySelector("input").checked) checked++;
      });
      emptyEl.style.display = visibleItems().length === 0 ? "block" : "none";
      countEl.textContent = "候选 " + items.length + " 个 · 已选 " + checked + " 个";
      okBtn.disabled = checked === 0;
    }

    // applyFilter 按搜索词过滤：匹配 id 或展示名，忽略大小写。
    function applyFilter() {
      var q = search.value.trim().toLowerCase();
      items.forEach(function (it) {
        var hay = it.getAttribute("data-search") || "";
        it.style.display = (q === "" || hay.indexOf(q) >= 0) ? "flex" : "none";
      });
      updatePickerState();
    }

    search.addEventListener("input", applyFilter);
    root.querySelector("#model-picker-all").addEventListener("click", function () {
      visibleItems().forEach(function (it) {
        var cb = it.querySelector("input");
        if (!cb.disabled) cb.checked = true;
      });
      updatePickerState();
    });
    root.querySelector("#model-picker-none").addEventListener("click", function () {
      visibleItems().forEach(function (it) {
        it.querySelector("input").checked = false;
      });
      updatePickerState();
    });
    root.querySelector("#model-picker-cancel").addEventListener("click", closeModelPicker);
    okBtn.addEventListener("click", function () {
      var selected = [];
      items.forEach(function (it) {
        var cb = it.querySelector("input");
        if (cb.checked && !cb.disabled) selected.push(byId[cb.value]);
      });
      closeModelPicker();
      if (selected.length) onAdd(selected);
    });
    // 仅在遮罩上按下并松开时才关闭，避免在搜索框内选中文字后拖到遮罩上误关闭。
    var overlayPressed = false;
    root.addEventListener("mousedown", function (e) {
      overlayPressed = e.target === root;
    });
    root.addEventListener("click", function (e) {
      if (e.target === root && overlayPressed) closeModelPicker();
    });
    document.addEventListener("keydown", onModelPickerKeydown, true);

    document.body.appendChild(root);
    modelPickerEl = root;
    applyFilter();
    search.focus();
  }

  // endpointModels 归一化某个端点的模型条目：GET api/providers 返回的是对象数组
  // （{id,name,...}），也兼容纯字符串；统一成 {id,name} 供列表展示。
  function endpointModels(models) {
    var out = [];
    (models || []).forEach(function (m) {
      var id = typeof m === "string" ? m : ((m && m.id) || "");
      var name = typeof m === "string" ? m : ((m && (m.name || m.id)) || "");
      if (id === "" && name === "") return;
      out.push({ id: id || name, name: name || id });
    });
    return out;
  }

  // modelNamesHtml 渲染端点模型名：优先 name，回退 id；两者不同的用 title 提示原始 id。
  function modelNamesHtml(models) {
    return models.map(function (m) {
      var name = m.name || m.id;
      if (!name) return "";
      if (name === m.id) return esc(name);
      return '<span title="' + esc(m.id) + '">' + esc(name) + "</span>";
    }).join(", ");
  }

  // endpointDetail 汇总某个端点的展示明细：优先用列表返回的字段，其次用本地记录；
  // 都缺失时 baseUrl/api 为空串、models 为空数组（渲染为"—"）。
  function endpointDetail(p) {
    var local = customEndpointDetails[p.id] || {};
    var models = (p.models && p.models.length) ? p.models : (local.models || []);
    return {
      baseUrl: p.baseUrl || local.baseUrl || "",
      api: p.api || local.api || "",
      models: endpointModels(models)
    };
  }

  // unknownDetailHtml 在列表未返回明细时渲染占位符，并说明为何看不到明细。
  function unknownDetailHtml() {
    return '<span title="api/providers 列表未返回该字段；本次会话内新增的端点会显示完整明细">—</span>';
  }

  // renderBuiltinProviders 渲染部署内置 provider（不带 custom 的条目）的只读列表：
  // 一行一个显示名 + id，带「内置」标签，没有删除按钮；列表由部署的 KEY_PROVIDERS 决定。
  function renderBuiltinProviders(list) {
    if (!modelSettingsEl) return;
    var box = modelSettingsEl.querySelector("#builtin-list");
    if (!box) return;
    var builtins = (list || []).filter(function (p) {
      return p && !p.custom && p.id;
    });
    if (builtins.length === 0) {
      box.innerHTML = '<div class="endpoint-empty">部署未配置内置 provider</div>';
      return;
    }
    box.innerHTML = "";
    builtins.forEach(function (p) {
      var item = document.createElement("div");
      item.className = "endpoint-item";
      item.innerHTML =
        '<div style="min-width:0">' +
        '<div class="endpoint-name">' + esc(p.name || p.id) +
          ' <span class="badge gray">内置</span></div>' +
        '<div class="endpoint-meta">id：<code>' + esc(p.id) + "</code></div>" +
        "</div>";
      box.appendChild(item);
    });
  }

  // renderEndpointList 渲染自定义端点列表：只在对话框仍打开时写 DOM。
  function renderEndpointList(list) {
    if (!modelSettingsEl) return;
    var box = modelSettingsEl.querySelector("#endpoint-list");
    if (!box) return;
    var customs = (list || []).filter(function (p) {
      return p && p.custom;
    });
    if (customs.length === 0) {
      box.innerHTML = '<div class="endpoint-empty">尚未定义自定义端点</div>';
      return;
    }
    box.innerHTML = "";
    customs.forEach(function (p) {
      var d = endpointDetail(p);
      var item = document.createElement("div");
      item.className = "endpoint-item";
      item.innerHTML =
        '<div style="min-width:0">' +
        '<div class="endpoint-name">' + esc(p.name || p.id) + "</div>" +
        '<div class="endpoint-meta">id：<code>' + esc(p.id) + "</code></div>" +
        '<div class="endpoint-meta">Base URL：' +
          (d.baseUrl ? "<code>" + esc(d.baseUrl) + "</code>" : unknownDetailHtml()) + "</div>" +
        '<div class="endpoint-meta">模型：' +
          (d.models.length ? modelNamesHtml(d.models) : unknownDetailHtml()) + "</div>" +
        (d.api ? '<div class="endpoint-meta">API 类型：<code>' + esc(d.api) + "</code></div>" : "") +
        "</div>" +
        '<button class="danger mini endpoint-del" title="从注册表移除该端点">删除</button>';
      item.querySelector(".endpoint-del").addEventListener("click", function () {
        deleteEndpoint(p.id, p.name || p.id);
      });
      box.appendChild(item);
    });
  }

  // loadEndpoints 拉取 provider 列表并渲染内置 / 自定义端点行，同时重填「用户 API Key」
  // 的 provider 下拉；refresh 为真时先失效缓存（增删端点后调用，让两个标签页立即反映变更）。
  function loadEndpoints(refresh) {
    return (refresh ? refreshProviders() : fetchProviders()).then(function (list) {
      renderBuiltinProviders(list);
      renderEndpointList(list);
      fillKeyProviderSelect(list);
      return list;
    });
  }

  // deleteEndpoint 删除一个自定义端点：确认后 DELETE api/providers/{id}，成功后
  // 失效 provider 缓存、重绘端点列表与用户表（Key 徽标与下拉即时生效）。
  function deleteEndpoint(id, name) {
    if (!window.confirm("确认删除自定义端点 \"" + name + "\"（id：" + id + "）？\n" +
        "删除后该端点不再出现在任何用户的 provider 列表中；已拉取该端点的 actor " +
        "仍保留本地 models.json 中的定义。")) {
      return;
    }
    clearMsg();
    fetch("api/providers/" + encodeURIComponent(id), { method: "DELETE" })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        delete customEndpointDetails[id];
        showMsg("已删除自定义端点：" + (j.message || id));
        loadEndpoints(true).then(function () {
          listUsers();
        });
      })
      .catch(function (err) {
        var error = modelSettingsEl && modelSettingsEl.querySelector("#endpoint-error");
        if (error) error.textContent = "删除失败：" + err.message;
        showMsg("删除模型端点失败：" + err.message, true);
      });
  }

  // isHTTPUrl 判断地址是否以 http:// 或 https:// 开头（与服务端校验保持一致）。
  function isHTTPUrl(u) {
    return u.indexOf("http://") === 0 || u.indexOf("https://") === 0;
  }

  // isPositiveInt 判断容量字段是否为正整数（占位符 256K/32K 只是提示，不接受 K 后缀）。
  function isPositiveInt(s) {
    return /^[0-9]+$/.test(s) && parseInt(s, 10) > 0;
  }

  // isBuiltinProviderId 判断 id 是否与内置 provider 冲突；缓存未就绪时不做本地判断，
  // 交给服务端返回同样的错误文案。
  function isBuiltinProviderId(id) {
    if (!providersCache) return false;
    for (var i = 0; i < providersCache.length; i++) {
      var p = providersCache[i];
      if (!p.custom && p.id === id) return true;
    }
    return false;
  }

  // apiBaseUrlPlaceholder 按协议给出占位地址：Anthropic Messages 的 SDK 会自行追加
  // /v1/messages，因此占位符不带 /v1。
  function apiBaseUrlPlaceholder(api) {
    return api === "anthropic-messages" ? "https://gateway.example" : "https://gateway.example/v1";
  }

  // expandModelRow 展开/收起模型行的容量与输入类型区域。
  function expandModelRow(row, expanded) {
    row.querySelector(".model-row-body").style.display = expanded ? "block" : "none";
    row.querySelector(".model-toggle").textContent = expanded ? "收起" : "展开";
  }

  // isModelRowExpanded 返回模型行当前是否处于展开状态。
  function isModelRowExpanded(row) {
    return row.querySelector(".model-row-body").style.display !== "none";
  }

  // addModelRow 在模型目录里追加一行：model 为空时是一张空行；来自「获取可用模型」的
  // 候选则预填 id / 名称 / 容量 / 输入类型，带容量或输入类型的候选默认展开，便于确认。
  function addModelRow(root, model) {
    model = model || {};
    var box = root.querySelector("#endpoint-rows");
    var row = document.createElement("div");
    row.className = "model-row";
    row.innerHTML =
      '<div class="model-row-head">' +
      '<input type="text" class="model-id" aria-label="模型 ID" placeholder="模型 ID *" autocomplete="off" spellcheck="false" />' +
      '<input type="text" class="model-name" aria-label="显示名称" placeholder="显示名称（可选）" autocomplete="off" spellcheck="false" />' +
      '<button class="secondary mini model-toggle" title="展开/收起容量与输入类型">展开</button>' +
      '<button class="danger mini model-del" title="移除该模型">删除</button>' +
      "</div>" +
      '<div class="model-row-body" style="display:none">' +
      '<div class="model-grid">' +
      '<div><label class="modal-label">上下文窗口</label>' +
      '<input type="text" class="model-context" aria-label="上下文窗口" placeholder="256K" autocomplete="off" spellcheck="false" /></div>' +
      '<div><label class="modal-label">最大输出 token 数</label>' +
      '<input type="text" class="model-maxtokens" aria-label="最大输出 token 数" placeholder="32K" autocomplete="off" spellcheck="false" /></div>' +
      "</div>" +
      '<label class="modal-label">输入类型</label>' +
      '<div class="model-input-types">' +
      '<label><input type="checkbox" class="model-input-text" /> 文本</label>' +
      '<label><input type="checkbox" class="model-input-image" /> 图片</label>' +
      "</div>" +
      "</div>" +
      '<div class="modal-error model-row-error"></div>';

    row.querySelector(".model-id").value = model.id ? String(model.id) : "";
    row.querySelector(".model-name").value = model.name ? String(model.name) : "";
    if (model.contextWindow != null) {
      row.querySelector(".model-context").value = String(model.contextWindow);
    }
    if (model.maxTokens != null) {
      row.querySelector(".model-maxtokens").value = String(model.maxTokens);
    }
    var types = model.input || [];
    row.querySelector(".model-input-text").checked = types.indexOf("text") >= 0;
    row.querySelector(".model-input-image").checked = types.indexOf("image") >= 0;
    expandModelRow(row, types.length > 0 || model.contextWindow != null || model.maxTokens != null);

    row.querySelector(".model-toggle").addEventListener("click", function () {
      expandModelRow(row, !isModelRowExpanded(row));
    });
    row.querySelector(".model-del").addEventListener("click", function () {
      // 允许删到一行不剩；保存按钮会被下面的刷新逻辑禁用并给出原因。
      box.removeChild(row);
      refreshEndpointForm(root);
    });
    // 行内任何改动都重算校验状态（逐行错误、目录下方原因、保存按钮可用性）。
    row.addEventListener("input", function () {
      refreshEndpointForm(root);
    });
    row.addEventListener("change", function () {
      refreshEndpointForm(root);
    });
    box.appendChild(row);
    return row;
  }

  // collectModelRows 读取并校验模型目录的每一行：模型 ID 必填且不重复、容量必须是正
  // 整数；错误写到行内（容量错误同时自动展开该行），返回 {models, valid, message}。
  // models 是可直接提交的对象数组：空的 name/容量省略；文本与图片都不勾选时省略
  // input（交给 pi-web 沿用默认），只勾图片则下发 ["image"]。
  function collectModelRows(root) {
    var rows = Array.prototype.slice.call(root.querySelectorAll("#endpoint-rows .model-row"));
    var counts = {};
    var ids = rows.map(function (row) {
      var id = row.querySelector(".model-id").value.trim();
      if (id !== "") counts[id] = (counts[id] || 0) + 1;
      return id;
    });
    var models = [];
    var valid = true;
    var message = "";
    rows.forEach(function (row, i) {
      var id = ids[i];
      var contextWindow = row.querySelector(".model-context").value.trim();
      var maxTokens = row.querySelector(".model-maxtokens").value.trim();
      var msg = "";
      if (id === "") {
        msg = "模型 ID 不能为空";
      } else if (counts[id] > 1) {
        msg = '模型 "' + id + '" 重复';
      } else if (contextWindow !== "" && !isPositiveInt(contextWindow)) {
        msg = '模型 "' + id + '" 的上下文窗口必须是正整数';
      } else if (maxTokens !== "" && !isPositiveInt(maxTokens)) {
        msg = '模型 "' + id + '" 的最大输出 token 数必须是正整数';
      }
      row.querySelector(".model-row-error").textContent = msg;
      if (msg !== "") {
        valid = false;
        if (message === "") message = msg;
        if (msg.indexOf("正整数") >= 0) expandModelRow(row, true); // 收起时看不见，自动展开
        return;
      }
      var m = { id: id };
      var name = row.querySelector(".model-name").value.trim();
      if (name !== "") m.name = name;
      if (contextWindow !== "") m.contextWindow = parseInt(contextWindow, 10);
      if (maxTokens !== "") m.maxTokens = parseInt(maxTokens, 10);
      var types = [];
      if (row.querySelector(".model-input-text").checked) types.push("text");
      if (row.querySelector(".model-input-image").checked) types.push("image");
      if (types.length) m.input = types;
      models.push(m);
    });
    if (rows.length === 0) {
      valid = false;
      message = "至少要指定一个模型名";
    }
    return { models: models, valid: valid, message: message };
  }

  // existingModelIds 收集表单里已填的模型 ID，供"选择模型"对话框把它们标为已添加。
  function existingModelIds(root) {
    var out = {};
    var rows = root.querySelectorAll("#endpoint-rows .model-row");
    Array.prototype.forEach.call(rows, function (row) {
      var id = row.querySelector(".model-id").value.trim();
      if (id !== "") out[id] = true;
    });
    return out;
  }

  // clearDiscoverNote 清空模型目录下方的探测提示（候选信息 / 服务端错误）：地址或
  // 协议变了，上一次探测结果就不再适用。
  function clearDiscoverNote(root) {
    var note = root.querySelector("#endpoint-catalog-note");
    note.className = "modal-hint";
    note.textContent = "";
  }

  // normalizeCandidates 归一化 api/providers/discover 返回的模型条目：兼容对象与纯
  // 字符串，并补齐 name（服务端已保证有 name，这里再兜一层）。
  function normalizeCandidates(models) {
    var out = [];
    (models || []).forEach(function (m) {
      if (typeof m === "string") {
        if (m.trim() !== "") out.push({ id: m.trim(), name: m.trim() });
        return;
      }
      if (!m || !m.id) return;
      var id = String(m.id);
      var item = { id: id, name: m.name ? String(m.name) : id };
      if (m.contextWindow != null) item.contextWindow = m.contextWindow;
      if (m.maxTokens != null) item.maxTokens = m.maxTokens;
      out.push(item);
    });
    return out;
  }

  // refreshEndpointForm 统一重算新增端点表单的状态：Provider ID / API 地址的内联错误、
  // 显示名称占位符、「获取可用模型」的可用性与原因、逐行模型错误，以及保存按钮的可用性
  // （模型列表为空或任一行非法时禁用，原因显示在模型目录下方）。
  function refreshEndpointForm(root) {
    if (!root || root !== modelSettingsEl) return { models: [], valid: false, message: "" };

    var id = root.querySelector("#endpoint-id").value.trim();
    var idHint = root.querySelector("#endpoint-id-hint");
    var idError = "";
    if (id !== "" && !/^[a-z0-9][a-z0-9._-]*$/.test(id)) {
      idError = 'provider id "' + id + '" 非法：需匹配 ^[a-z0-9][a-z0-9._-]*$';
    } else if (isBuiltinProviderId(id)) {
      idError = 'provider id "' + id + '" 与内置 provider 冲突，请换一个';
    }
    // 校验不通过时用内联错误替换常驻提示。
    idHint.className = idError ? "modal-error" : "modal-hint";
    idHint.textContent = idError || ENDPOINT_ID_HINT;

    // 显示名称留空时，占位符回退到 Provider ID，再回退到"显示名称"。
    root.querySelector("#endpoint-name").placeholder = id || "显示名称";

    var url = root.querySelector("#endpoint-baseurl").value.trim();
    var badUrl = url !== "" && !isHTTPUrl(url);
    root.querySelector("#endpoint-url-error").textContent = badUrl ?
      'API 地址 "' + url + '" 非法：需要 http:// 或 https:// 开头的完整地址' : "";

    var state = collectModelRows(root);
    root.querySelector("#endpoint-model-error").textContent = state.valid ? "" : state.message;

    // 「获取可用模型」：地址为空或非法时禁用，并用 title 说明原因。
    var urlReason = url === "" ? "请先填写 API 地址" :
      (badUrl ? "API 地址需要以 http:// 或 https:// 开头" : "");
    var busy = root._discovering === true;
    var discoverBtn = root.querySelector("#endpoint-discover");
    discoverBtn.disabled = busy || urlReason !== "";
    discoverBtn.title = busy ? "正在询问提供商…" :
      (urlReason || "向该地址请求模型列表，再勾选要添加的模型");

    root.querySelector("#endpoint-ok").disabled = !state.valid;
    return state;
  }

  // discoverModels 调用 api/providers/discover 探测该端点的模型列表：有候选时打开勾选
  // 对话框，没有候选时只给内联提示；失败时保留全部已填字段，并把服务端 error 显示在
  // 模型目录下方，管理员仍可手工添加模型行。探测用的 API Key 只存在于本次请求体里，
  // 绝不进入保存端点的请求。
  function discoverModels(root) {
    var urlInput = root.querySelector("#endpoint-baseurl");
    var apiSelect = root.querySelector("#endpoint-api");
    var keyInput = root.querySelector("#endpoint-apikey");
    var btn = root.querySelector("#endpoint-discover");
    var note = root.querySelector("#endpoint-catalog-note");
    var baseUrl = urlInput.value.trim();
    if (baseUrl === "" || !isHTTPUrl(baseUrl)) {
      refreshEndpointForm(root); // 兜底：按钮此时本应处于禁用状态
      return;
    }
    var payload = { baseUrl: baseUrl, api: apiSelect.value };
    var apiKey = keyInput.value.trim();
    if (apiKey !== "") payload.apiKey = apiKey;

    clearDiscoverNote(root);
    root._discovering = true;
    btn.disabled = true;
    btn.textContent = "正在询问提供商…";
    fetch("api/providers/discover", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        if (root !== modelSettingsEl) return; // 对话框已关闭，丢弃本次结果
        var candidates = normalizeCandidates(j.models);
        if (candidates.length === 0) {
          // 端点确实没列出模型：只是内联提示，不是页面级错误，表单保持可用。
          note.textContent = "该端点没有列出任何模型，请手动添加";
          return;
        }
        openModelPicker(candidates, existingModelIds(root), function (selected) {
          // 二次确认已存在的 ID，保证采纳候选不会产生重复行。
          var present = existingModelIds(root);
          selected.forEach(function (m) {
            if (present[m.id]) return;
            present[m.id] = true;
            addModelRow(root, m);
          });
          refreshEndpointForm(root);
        });
      })
      .catch(function (err) {
        if (root !== modelSettingsEl) return; // 对话框已关闭，无人可提示
        note.className = "modal-error";
        note.textContent = err.message;
      })
      .finally(function () {
        root._discovering = false;
        btn.textContent = "获取可用模型";
        refreshEndpointForm(root);
      });
  }

  // submitEndpoint 校验并 POST 新端点：模型目录必填且逐行合法，API 地址必须是
  // http(s):// 开头的完整地址（与服务端校验一致）；通过后清空表单并刷新缓存与列表。
  function submitEndpoint(root) {
    var idInput = root.querySelector("#endpoint-id");
    var nameInput = root.querySelector("#endpoint-name");
    var urlInput = root.querySelector("#endpoint-baseurl");
    var apiSelect = root.querySelector("#endpoint-api");
    var error = root.querySelector("#endpoint-error");
    var okBtn = root.querySelector("#endpoint-ok");

    var id = idInput.value.trim();
    var name = nameInput.value.trim();
    var baseUrl = urlInput.value.trim();

    error.textContent = "";
    var state = refreshEndpointForm(root);
    if (!state.valid) {
      error.textContent = state.message; // 与模型目录下方的内联原因一致，便于定位
      return;
    }
    if (id === "" && name === "") {
      error.textContent = "请至少填写 Provider ID 或显示名称";
      idInput.focus();
      return;
    }
    if (baseUrl === "") {
      error.textContent = "baseUrl 不能为空";
      urlInput.focus();
      return;
    }
    if (!isHTTPUrl(baseUrl)) {
      error.textContent = 'baseUrl "' + baseUrl + '" 非法：需要 http:// 或 https:// 开头的完整地址';
      urlInput.focus();
      return;
    }

    // 探测用的 API Key 绝不进入这里：下面的请求体里没有它。
    var payload = {
      baseUrl: baseUrl,
      api: apiSelect.value,
      models: state.models
    };
    if (id !== "") payload.id = id; // 留空则由服务端根据显示名生成
    if (name !== "") payload.name = name;

    okBtn.disabled = true;
    okBtn.textContent = "保存中…";
    clearMsg();
    fetch("api/providers", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        var saved = j.provider || {};
        if (saved.id) {
          customEndpointDetails[saved.id] = { baseUrl: baseUrl, api: payload.api, models: state.models };
        }
        // 清空表单（含探测用 Key）便于连续添加；对话框保持打开，便于确认列表与用户表已更新。
        idInput.value = "";
        nameInput.value = "";
        urlInput.value = "";
        root.querySelector("#endpoint-apikey").value = "";
        root.querySelector("#endpoint-rows").innerHTML = "";
        apiSelect.value = "openai-completions";
        urlInput.placeholder = apiBaseUrlPlaceholder(apiSelect.value);
        clearDiscoverNote(root);
        refreshEndpointForm(root);
        showMsg("自定义模型端点：" + (j.message || "已保存"));
        // 失效并重取 provider 缓存：端点列表与「用户 API Key」下拉立即出现新端点。
        loadEndpoints(true).then(function () {
          listUsers();
        });
      })
      .catch(function (err) {
        // 服务端错误同时给出对话框内联提示与页面级提示。
        error.textContent = err.message;
        showMsg("保存模型端点失败：" + err.message, true);
      })
      .finally(function () {
        okBtn.textContent = "保存端点";
        refreshEndpointForm(root);
      });
  }

  // showSettingsTab 切换「模型设置」的标签页：只改 hidden / aria-selected，两个面板始终
  // 保留在 DOM 中（hide 而非 destroy），所以「模型端点」表单里已填的草稿不会因为切标签
  // 而丢失。每次显示「用户 API Key」都重新拉取用户下拉并重填 provider 下拉。
  function showSettingsTab(root, tabId) {
    var tabs = root.querySelectorAll('[role="tab"]');
    var panelId = "";
    Array.prototype.forEach.call(tabs, function (t) {
      var selected = t.id === tabId;
      t.setAttribute("aria-selected", selected ? "true" : "false");
      t.tabIndex = selected ? 0 : -1;
      if (selected) panelId = t.getAttribute("aria-controls");
    });
    var panels = root.querySelectorAll('[role="tabpanel"]');
    Array.prototype.forEach.call(panels, function (p) {
      p.hidden = p.id !== panelId;
    });
    if (tabId === "settings-tab-userkey") {
      loadKeyTabUsers();
      fetchProviders().then(function (list) {
        if (root === modelSettingsEl) fillKeyProviderSelect(list);
      });
    }
  }

  // openModelSettings 打开唯一的「模型设置」对话框：标签页「模型端点」（内置 provider
  // 只读列表 + 自定义端点列表 + 新增端点表单）与「用户 API Key」（按用户设置/清除凭据）。
  // 取消 / Esc / 点击遮罩关闭，关闭时整体从 DOM 移除。
  function openModelSettings() {
    closeModelSettings();
    var root = document.createElement("div");
    root.className = "modal-overlay";
    root.innerHTML =
      '<div class="modal endpoint-modal" role="dialog" aria-modal="true" aria-label="模型设置">' +
      '<div class="modal-title">模型设置</div>' +

      '<button class="tab" id="settings-tab-endpoints" role="tab" aria-selected="true"' +
      ' aria-controls="settings-panel-endpoints" tabindex="0">模型端点</button>' +
      '<button class="tab" id="settings-tab-userkey" role="tab" aria-selected="false"' +
      ' aria-controls="settings-panel-userkey" tabindex="-1">用户 API Key</button>' +
      "</div>" +
      // 标签页 1：模型端点（部署级，所有用户可见）。
      '<div class="tab-panel" id="settings-panel-endpoints" role="tabpanel" aria-labelledby="settings-tab-endpoints">' +
      '<div class="modal-note">端点对部署内所有用户可见、可在「用户 API Key」中选择；' +
      "每个用户的凭据（API Key）仍各自存储。</div>" +
      '<label class="modal-label">内置 Provider</label>' +
      '<div class="endpoint-list" id="builtin-list">' +
      '<div class="endpoint-empty">正在加载…</div>' +
      "</div>" +
      '<div class="modal-hint">内置列表由部署的 <code>KEY_PROVIDERS</code> 决定，只读、不可编辑或删除。</div>' +
      '<label class="modal-label">自定义端点</label>' +
      '<div class="endpoint-list" id="endpoint-list">' +
      '<div class="endpoint-empty">正在加载…</div>' +
      "</div>" +
      '<label class="modal-label" for="endpoint-id">Provider ID（可选）</label>' +
      '<input type="text" id="endpoint-id" placeholder="acme-gateway" autocomplete="off" spellcheck="false" />' +
      '<div class="modal-hint" id="endpoint-id-hint"></div>' +
      '<label class="modal-label" for="endpoint-name">显示名称</label>' +
      '<input type="text" id="endpoint-name" placeholder="显示名称" autocomplete="off" spellcheck="false" />' +
      '<label class="modal-label" for="endpoint-baseurl">API 地址</label>' +
      '<input type="text" id="endpoint-baseurl" placeholder="https://gateway.example/v1" autocomplete="off" spellcheck="false" />' +
      '<div class="modal-error" id="endpoint-url-error"></div>' +
      '<label class="modal-label" for="endpoint-api">API 协议</label>' +
      '<select id="endpoint-api">' +
      '<option value="openai-completions">OpenAI Chat Completions</option>' +
      '<option value="openai-responses">OpenAI Responses</option>' +
      '<option value="anthropic-messages">Anthropic Messages</option>' +
      "</select>" +
      '<label class="modal-label" for="endpoint-apikey">API Key（仅用于探测，不会保存）</label>' +
      '<input type="text" id="endpoint-apikey" placeholder="sk-..." autocomplete="off" spellcheck="false" />' +
      '<div class="modal-hint">仅用于「获取可用模型」向该地址发起一次探测，不会写入任何 Secret；' +
      "每个用户的凭据在「用户 API Key」标签页中配置。</div>" +
      '<div class="endpoint-section-head">' +
      '<span class="modal-label">模型目录 *</span>' +
      '<button class="secondary mini" id="endpoint-discover">获取可用模型</button>' +
      "</div>" +
      '<div class="endpoint-rows" id="endpoint-rows"></div>' +
      '<div class="endpoint-rows-actions">' +
      '<button class="secondary mini" id="endpoint-add-model">添加模型</button>' +
      '<span class="modal-hint" id="endpoint-catalog-note"></span>' +
      "</div>" +
      '<div class="modal-error" id="endpoint-model-error"></div>' +
      '<div class="modal-error" id="endpoint-error"></div>' +
      '<div class="modal-actions">' +
      '<button class="secondary" id="endpoint-cancel">取消</button>' +
      '<button id="endpoint-ok">保存端点</button>' +
      "</div>" +
      "</div>" +
      // 标签页 2：用户 API Key（每用户凭据；用户与 provider 下拉每次显示都重填）。
      '<div class="tab-panel" id="settings-panel-userkey" role="tabpanel" aria-labelledby="settings-tab-userkey" hidden>' +
