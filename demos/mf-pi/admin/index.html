<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>mf-pi 用户管理</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e2e5ea;
    --text: #1f2329;
    --muted: #6b7280;
    --accent: #2563eb;
    --danger: #dc2626;
    --green: #16a34a;
    --green-bg: #dcfce7;
    --gray: #6b7280;
    --gray-bg: #f3f4f6;
    --blue: #2563eb;
    --blue-bg: #dbeafe;
    --red: #dc2626;
    --red-bg: #fee2e2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .container {
    width: 100%;
    max-width: 100%;
    margin: 24px auto;
    padding: 0 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 20px;
    overflow-x: auto;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  form { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
  }
  input[type="file"] {
    padding: 8px 4px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    color: var(--text);
    background: #fff;
  }
  input[type="file"]::file-selector-button {
    background: #eef0f3;
    color: var(--text);
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    margin-right: 8px;
    cursor: pointer;
  }
  input[type="file"]::file-selector-button:hover { background: #e2e5ea; }
  button {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  button.secondary { background: #eef0f3; color: var(--text); }
  button.danger { background: var(--danger); }
  button.mini { padding: 4px 10px; font-size: 13px; }
  #msg {
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 12px;
    font-size: 14px;
    display: none;
  }
  #msg.ok { display: block; background: var(--green-bg); color: var(--green); }
  #msg.err { display: block; background: var(--red-bg); color: var(--red); }
  table { width: 100%; min-width: 960px; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  td.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
  td.actions { white-space: nowrap; }
  td a, td a:visited { color: var(--accent); text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .dropdown { position: relative; display: inline-block; }
  .dropdown-toggle {
    padding: 4px 10px;
    font-size: 13px;
    background: #eef0f3;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
  }
  .dropdown-toggle:hover { background: #e2e5ea; }
  .dropdown-menu {
    position: fixed;
    min-width: 140px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    z-index: 1000;
    padding: 4px;
    display: none;
  }
  .dropdown.open .dropdown-menu { display: block; }
  .dropdown-menu button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 8px 12px;
    font-size: 13px;
    border: none;
    background: transparent;
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
  }
  .dropdown-menu button:hover { background: var(--gray-bg); }
  .dropdown-menu button.danger { color: var(--danger); }
  .dropdown-menu button.danger:hover { background: var(--red-bg); }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.green { background: var(--green-bg); color: var(--green); }
  .badge.gray { background: var(--gray-bg); color: var(--gray); }
  .badge.blue { background: var(--blue-bg); color: var(--blue); }
  .badge.red { background: var(--red-bg); color: var(--red); }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
  #empty { color: var(--muted); text-align: center; padding: 24px 0; }
  /* 设置 API Key 对话框：遮罩 + 居中面板，关闭时整体从 DOM 移除。 */
  .modal-overlay {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    background: rgba(15, 23, 42, 0.45);
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal {
    background: var(--card);
    border-radius: 8px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.2);
    padding: 16px;
    width: 100%;
    max-width: 420px;
  }
  .modal-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .modal-label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .modal select, .modal input[type="text"] {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    background: #fff;
    color: var(--text);
    margin-bottom: 12px;
  }
  .modal select:disabled { color: var(--muted); }
  .modal-note, .modal-hint { font-size: 12px; color: var(--muted); margin: -4px 0 12px; }
  .modal-error { font-size: 13px; color: var(--danger); margin: -4px 0 8px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>mf-pi 用户管理</h1>
    <div class="sub" id="atespace-info">正在加载 atespace 信息…</div>
  </div>
  <div class="toolbar" style="margin-bottom: 0">
    <button class="secondary" id="refresh-btn">刷新</button>
  </div>
</header>

<div class="container">
  <div id="msg"></div>

  <div class="card">
    <h2>添加用户</h2>
    <form id="add-form">
      <input type="text" id="name-input" placeholder="用户名（DNS-1123：小写字母、数字、中划线）"
             autocomplete="off" spellcheck="false" />
      <button type="submit">添加</button>
    </form>
  </div>

  <div class="card" id="skills-card">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
      <div>
        <h2 style="margin-bottom:2px">共享 Skills</h2>
        <div class="sub" style="color:var(--muted); font-size:13px;">
          管理员托管的 skill，自动分发到所有用户；每 10 秒同步，支持 .tgz / .zip
        </div>
      </div>
      <div id="apply-wrap" style="display:flex; gap:8px; align-items:center;">
        <span id="apply-note" class="sub" style="color:var(--muted); font-size:13px;"></span>
        <button class="secondary" id="apply-skills-btn" title="向所有运行中的用户扇出 reload，让已打开的会话立即可用新 skill">立即应用</button>
      </div>
    </div>

    <form id="skill-upload-form" style="margin-top:12px; flex-wrap:wrap;">
      <input type="text" id="skill-name-input" placeholder="skill 名称（小写字母/数字/中划线）" autocomplete="off" spellcheck="false"
             style="flex:0 1 260px;" />
      <input type="file" id="skill-file-input" accept=".tgz,.tar.gz,.zip" style="flex:1 1 220px;" />
      <button type="submit" id="skill-upload-btn">上传</button>
    </form>

    <div id="skill-empty" style="display:none; color:var(--muted); text-align:center; padding:20px 0;">
      尚未托管任何 skill
    </div>
    <table id="skill-table" style="display:none; min-width:640px;">
      <thead>
        <tr>
          <th>名称</th>
          <th>大小</th>
          <th>更新时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="skill-body"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>用户列表</h2>
    <div id="empty" style="display:none">暂无用户</div>
    <table id="user-table" style="display:none">
      <thead>
        <tr>
          <th>名称</th>
          <th>状态</th>
          <th>API Key</th>
          <th>模板</th>
          <th>ATEOM Pod</th>
          <th>IP</th>
          <th>版本</th>
          <th>年龄</th>
          <th>有效期</th>
          <th>档位</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="user-body"></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  "use strict";

  var atespace = null;

  // openMenuUser 记录当前展开的用户操作菜单对应的用户名。用户列表每 5 秒
  // 自动刷新并重建 <tbody>，若不记录并在重建后恢复，正在操作的菜单会被
  // 下一次刷新"自己弄消失"（表现为 hover 菜单时菜单突然消失）。
  var openMenuUser = null;

  function showMsg(text, isErr) {
    var el = document.getElementById("msg");
    el.className = isErr ? "err" : "ok";
    el.textContent = text;
  }

  function clearMsg() {
    document.getElementById("msg").className = "";
    document.getElementById("msg").textContent = "";
  }

  function badgeClass(status) {
    if (status === "STATUS_RUNNING") return "green";
    if (status === "STATUS_SUSPENDED") return "gray";
    if (status === "STATUS_SUSPENDING" || status === "STATUS_PAUSING" ||
        status === "STATUS_RESUMING") return "blue";
    if (status === "STATUS_CRASHED") return "red";
    return "gray";
  }

  function statusLabel(status) {
    var labels = {
      STATUS_RUNNING: "运行中",
      STATUS_SUSPENDED: "已挂起",
      STATUS_SUSPENDING: "挂起中",
      STATUS_PAUSING: "暂停中",
      STATUS_PAUSED: "已暂停",
      STATUS_RESUMING: "恢复中",
      STATUS_CRASHED: "崩溃"
    };
    return labels[status] || status;
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // providersCache 缓存 GET api/providers 的结果（首次成功后复用，自动刷新不会
  // 覆盖它）；providersPromise 去重并发请求，避免对话框与页面加载各拉一次。
  var providersCache = null;
  var providersPromise = null;
  // 拉取失败时的兜底 provider：至少让管理员仍能完成设置 Key 的操作。
  var fallbackProviders = [{ id: "deepseek", name: "DeepSeek" }];

  // fetchProviders 返回 provider 列表（{id,name} 数组）的 Promise；成功后缓存，
  // 失败则回退到 fallbackProviders 并允许下次重试。
  function fetchProviders() {
    if (providersCache) {
      return Promise.resolve(providersCache);
    }
    if (providersPromise) {
      return providersPromise;
    }
    providersPromise = fetch("api/providers")
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (data) {
        var list = (data && data.providers) || [];
        providersCache = list.length ? list : fallbackProviders;
        return providersCache;
      })
      .catch(function () {
        // 失败不缓存，下次调用可重试；本次用兜底列表继续。
        providersPromise = null;
        return fallbackProviders;
      });
    return providersPromise;
  }

  // providerDisplayName 把 provider id 解析为展示名；未加载或未知 id 时原样返回 id。
  function providerDisplayName(id) {
    if (!id) return "";
    if (providersCache) {
      for (var i = 0; i < providersCache.length; i++) {
        if (providersCache[i].id === id) return providersCache[i].name;
      }
    }
    return id;
  }

  // listProviders 页面加载时预取一次 provider 列表；就绪后重绘用户表，使 Key 徽标
  // 立即可显示展示名（而不是 provider id）。
  function listProviders() {
    fetchProviders().then(function () {
      if (atespace !== null) listUsers();
    });
  }

  // expiryDisplayHtml renders the 有效期 column: "—" when unset, "已到期" when
  // a RUNNING actor is past its expiry (auto-suspend pending), else the raw
  // RFC3339 timestamp.
  function expiryDisplayHtml(u) {
    if (!u.hasExpiry || !u.expiry) {
      return '<span class="badge gray">—</span>';
    }
    if (u.status === "STATUS_RUNNING" && new Date(u.expiry).getTime() < Date.now()) {
      return '<span class="badge red" title="激活有效期已到（' + esc(u.expiry) + '），将由后台自动挂起释放资源">已到期</span>';
    }
    return '<span class="badge gray" title="激活有效期（到期后自动挂起释放资源，可恢复）">' + esc(u.expiry) + "</span>";
  }

  function closeAllDropdowns() {
    document.querySelectorAll(".dropdown.open").forEach(function (d) {
      d.classList.remove("open");
    });
  }

  // positionDropdown 使用 fixed 定位并依据按钮位置计算坐标，避免被 .card
  // 的 overflow-x:auto 裁剪（短列表时下拉会超出卡片底部被截掉）。
  function positionDropdown(toggle, menu) {
    var rect = toggle.getBoundingClientRect();
    var mw = menu.offsetWidth;
    var mh = menu.offsetHeight;
    var left = rect.right - mw;
    var top = rect.bottom + 4;
    // 下方空间不足时向上弹出。
    if (top + mh > window.innerHeight - 8) {
      top = rect.top - mh - 4;
    }
    // 超出左边界时夹紧到可视区内。
    if (left < 8) left = 8;
    menu.style.left = left + "px";
    menu.style.top = top + "px";
  }

  function openUserMenu(toggle) {
    var dropdown = toggle.parentElement;
    var menu = dropdown.querySelector(".dropdown-menu");
    closeAllDropdowns();
    dropdown.classList.add("open");
    openMenuUser = toggle.getAttribute("data-user");
    positionDropdown(toggle, menu);
  }

  function renderUsers(users) {
    var table = document.getElementById("user-table");
    var empty = document.getElementById("empty");
    var body = document.getElementById("user-body");
    // 记住刷新前展开的菜单，重建后按用户名恢复，避免自动刷新把用户正在
    // 操作的菜单关掉（重建期间统一清空 openMenuUser，恢复时再写回）。
    var prevOpenUser = openMenuUser;
    openMenuUser = null;
    body.innerHTML = "";

    if (!users || users.length === 0) {
      table.style.display = "none";
      empty.style.display = "block";
      return;
    }
    table.style.display = "table";
    empty.style.display = "none";

    users.forEach(function (u) {
      var tr = document.createElement("tr");
      // 用户名链接到对应的 agent 页面：http://<hostname>:58681/<username>/
      var agentUrl = window.location.origin + "/" + encodeURIComponent(u.name) + "/";
      // Key 徽标：显示该用户已存储 Key 的 provider 展示名，未设置则显示灰色未设置。
      var keyProviderId = u.personalKeyProvider || "";
      var keyProviderName = providerDisplayName(keyProviderId);
      var keyBadge = u.hasPersonalKey ?
        '<span class="badge green" title="' + esc(keyProviderName ?
          "已为该用户存储 " + keyProviderName + " 的专属 API Key" :
          "已为该用户存储专属 API Key") + '">' +
        esc(keyProviderName || "已设置") + "</span>" :
        '<span class="badge gray" title="未存储专属 Key，agent 将使用内置/环境变量凭据">未设置</span>';
      // 操作菜单提示同样按该用户实际的 provider 命名，避免写死 DeepSeek。
      var setKeyTitle = keyProviderName ?
        "为运行中的 agent 写入专属 " + keyProviderName + " API Key（保存后退出旧 provider）" :
        "为该用户设置专属 API Key（可选择 provider）";
      var clearKeyTitle = keyProviderName ?
        "退出登录并清除专属 " + keyProviderName + " API Key" :
        "清除该用户的专属 API Key（当前未设置）";
      var expiryCell = expiryDisplayHtml(u);
      var tierBadge = u.tier ?
        '<span class="badge blue" title="该用户的资源档位（作用于新建/重建，存量用户不变）">' + esc(u.tier) + "</span>" :
        '<span class="badge gray">—</span>';
      tr.innerHTML =
        '<td class="mono"><a href="' + esc(agentUrl) + '" target="_blank" rel="noopener" title="打开 agent 页面">' + esc(u.name) + "</a></td>" +
        '<td><span class="badge ' + badgeClass(u.status) + '">' + esc(statusLabel(u.status)) + "</span></td>" +
        '<td>' + keyBadge + "</td>" +
        '<td class="mono">' + esc(u.template) + "</td>" +
        '<td class="mono">' + esc(u.ateomPod) + "</td>" +
        '<td class="mono">' + esc(u.ip) + "</td>" +
        "<td>" + esc(u.version) + "</td>" +
        "<td>" + esc(u.age) + "</td>" +
        "<td>" + expiryCell + "</td>" +
        "<td>" + tierBadge + "</td>" +
        '<td class="actions"><div class="dropdown">' +
        '<button class="dropdown-toggle" data-user="' + esc(u.name) + '">操作 ▾</button>' +
        '<div class="dropdown-menu">' +
        '<button class="copy-pwd">复制密码</button>' +
        '<button class="reset-pwd">重置密码</button>' +
        '<button class="set-key" title="' + esc(setKeyTitle) + '">设置 Key</button>' +
        '<button class="clear-key" title="' + esc(clearKeyTitle) + '">清除 Key</button>' +
        '<button class="set-expiry" title="设置激活有效期，到期后自动挂起释放资源">设置有效期</button>' +
        '<button class="clear-expiry" title="撤销激活有效期，停止到期自动挂起">清除有效期</button>' +
        '<button class="set-tier" title="设置用户资源档位（新建/重建后生效）">设置资源档位</button>' +
        '<button class="danger del">删除</button>' +
        "</div></div></td>";
      tr.querySelector(".dropdown-toggle").addEventListener("click", function (e) {
        e.stopPropagation();
        var dropdown = this.parentElement;
        var wasOpen = dropdown.classList.contains("open");
        // 再次点击已展开的按钮则收起。
        if (wasOpen) {
          dropdown.classList.remove("open");
          openMenuUser = null;
          return;
        }
        // openUserMenu 会关闭其它已打开的菜单（避免多个同时显示）并记录
        // 当前用户名，供自动刷新后恢复。
        openUserMenu(this);
      });
      tr.querySelector(".copy-pwd").addEventListener("click", function () {
        copyPassword(u.name);
      });
      tr.querySelector(".reset-pwd").addEventListener("click", function () {
        resetPassword(u.name);
      });
      tr.querySelector(".set-key").addEventListener("click", function () {
        setUserAPIKey(u.name, keyProviderId);
      });
      tr.querySelector(".clear-key").addEventListener("click", function () {
        clearUserAPIKey(u.name, keyProviderId);
      });
      tr.querySelector(".set-expiry").addEventListener("click", function () {
        setUserExpiry(u.name);
      });
      tr.querySelector(".clear-expiry").addEventListener("click", function () {
        clearUserExpiry(u.name);
      });
      tr.querySelector(".set-tier").addEventListener("click", function () {
        setUserTier(u.name, u.tier);
      });
      tr.querySelector(".del").addEventListener("click", function () {
        deleteUser(u.name);
      });
      body.appendChild(tr);
      // 该用户的菜单在刷新前是展开的：行已重建并挂到 DOM，重新展开并定位，
      // 使用户正在操作的菜单不会因自动刷新而消失。
      if (u.name === prevOpenUser) {
        openUserMenu(tr.querySelector(".dropdown-toggle"));
      }
    });
  }

  function listUsers() {
    fetch("api/users")
      .then(function (res) {
        if (!res.ok) {
          return res.json().then(function (j) {
            throw new Error((j && j.error) || ("HTTP " + res.status));
          });
        }
        return res.json();
      })
      .then(function (data) {
        atespace = data.atespace;
        document.getElementById("atespace-info").textContent =
          "atespace: " + esc(data.atespace) + " · 每 5 秒自动刷新";
        renderUsers(data.users);
      })
      .catch(function (err) {
        showMsg("列出用户失败：" + err.message, true);
      });
  }

  function deleteUser(name) {
    if (!window.confirm("确认删除用户 \"" + name + "\"？actor 及其本地会话历史将删除；" +
        "用户数据保留在持久卷上（重新创建该用户后自动恢复）。")) {
      return;
    }
    clearMsg();
    fetch("api/users/" + encodeURIComponent(name), { method: "DELETE" })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("删除成功：" + (j.message || name));
        listUsers();
      })
      .catch(function (err) {
        showMsg("删除失败：" + err.message, true);
      });
  }

  // keyDialogEl 记录当前打开的"设置 API Key"对话框根节点（含遮罩）。对话框每次打开
  // 时新建、关闭时整体从 DOM 移除：既不会残留遮罩层，也不受 5 秒自动刷新重建用户表
  // 的影响（用户表刷新只重建 <tbody>，与对话框互不干扰）。
  var keyDialogEl = null;

  // closeKeyDialog 关闭对话框（若已打开）并注销 Esc 监听。
  function closeKeyDialog() {
    if (keyDialogEl && keyDialogEl.parentNode) {
      keyDialogEl.parentNode.removeChild(keyDialogEl);
    }
    keyDialogEl = null;
    document.removeEventListener("keydown", onKeyDialogKeydown, true);
  }

  // onKeyDialogKeydown 支持 Esc 关闭对话框。
  function onKeyDialogKeydown(e) {
    if (e.key === "Escape" || e.keyCode === 27) {
      closeKeyDialog();
    }
  }

  // submitUserAPIKey 提交 {apiKey, providerId}，沿用原有的成功/失败提示。
  function submitUserAPIKey(name, key, providerId) {
    clearMsg();
    fetch("api/users/" + encodeURIComponent(name) + "/apikey", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ apiKey: key, providerId: providerId })
    })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("用户 " + esc(j.name || name) + "：" + (j.message || "API Key 已设置"));
        listUsers();
      })
      .catch(function (err) {
        showMsg("设置 Key 失败：" + err.message, true);
      });
  }

  // setUserAPIKey 为指定用户打开 provider + API Key 对话框：provider 下拉来自
  // api/providers（首次成功后缓存，失败回退 DeepSeek），默认预选该用户已配置的
  // provider；校验非空后 POST {apiKey, providerId}。
  function setUserAPIKey(name, currentProvider) {
    closeKeyDialog(); // 同一时间只保留一个对话框
    var currentName = providerDisplayName(currentProvider) || currentProvider;
    var root = document.createElement("div");
    root.className = "modal-overlay";
    root.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true" aria-label="设置 API Key">' +
      '<div class="modal-title">为 "' + esc(name) + '" 设置专属 API Key</div>' +
      '<label class="modal-label" for="key-provider-select">Provider</label>' +
      '<select id="key-provider-select" disabled><option value="">加载中…</option></select>' +
      '<div class="modal-note" id="key-provider-note"></div>' +
      '<label class="modal-label" for="key-input">API Key</label>' +
      '<input type="text" id="key-input" placeholder="sk-..." autocomplete="off" spellcheck="false" />' +
      '<div class="modal-hint">Key 会写入 Secret 持久化并注入到该用户运行中的 agent；' +
      "若 agent 尚未恢复将自动恢复。</div>" +
      '<div class="modal-error" id="key-error"></div>' +
      '<div class="modal-actions">' +
      '<button class="secondary" id="key-cancel">取消</button>' +
      '<button id="key-ok">确定</button>' +
      "</div></div>";

    var select = root.querySelector("#key-provider-select");
    var note = root.querySelector("#key-provider-note");
    var input = root.querySelector("#key-input");
    var error = root.querySelector("#key-error");

    // updateNote 提示已配置的 provider：与所选一致时说明会覆盖，否则说明会切换。
    function updateNote() {
      if (!currentProvider) {
        note.textContent = "";
        return;
      }
      if (select.value === currentProvider) {
        note.textContent = "当前已设置：" + currentName + "（保存后将覆盖现有 Key）";
      } else {
        note.textContent = "当前已设置：" + currentName + "（保存后将切换并退出旧 provider）";
      }
    }

    // submit 做非空校验（内联提示），通过后关闭对话框并提交。
    function submit() {
      if (select.disabled) {
        // provider 列表尚未就绪，避免把占位项当作 providerId 提交。
        error.textContent = "Provider 列表加载中，请稍候…";
        return;
      }
      var key = input.value.trim();
      if (key === "") {
        error.textContent = "API Key 不能为空";
        input.focus();
        return;
      }
      closeKeyDialog();
      submitUserAPIKey(name, key, select.value);
    }

    root.querySelector("#key-cancel").addEventListener("click", closeKeyDialog);
    root.querySelector("#key-ok").addEventListener("click", submit);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.keyCode === 13) {
        e.preventDefault();
        submit();
      }
    });
    select.addEventListener("change", updateNote);
    // 仅在遮罩上按下并松开时才关闭，避免在输入框内选中文字后拖到遮罩上误关闭。
    var overlayPressed = false;
    root.addEventListener("mousedown", function (e) {
      overlayPressed = e.target === root;
    });
    root.addEventListener("click", function (e) {
      if (e.target === root && overlayPressed) closeKeyDialog();
    });
    document.addEventListener("keydown", onKeyDialogKeydown, true);

    document.body.appendChild(root);
    keyDialogEl = root;
    input.focus();

    // 异步填充 provider 列表；失败时 fetchProviders 已回退为 DeepSeek，仍可继续。
    fetchProviders().then(function (list) {
      if (keyDialogEl !== root) return; // 对话框已关闭，丢弃本次结果
      select.innerHTML = "";
      list.forEach(function (p) {
        var opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = p.name;
        select.appendChild(opt);
      });
      // 预选该用户已配置的 provider；列表里没有该 id 时补一项，保证能选中。
      select.value = currentProvider || "";
      if (currentProvider && !select.value) {
        var extra = document.createElement("option");
        extra.value = currentProvider;
        extra.textContent = currentName;
        select.insertBefore(extra, select.firstChild);
        select.value = currentProvider;
      }
      if (!select.value && list.length) {
        select.value = list[0].id;
      }
      select.disabled = false;
      updateNote();
    });
  }

  // clearUserAPIKey 清除该用户的专属 Key；确认文案按用户实际配置的 provider 命名，
  // 未配置时使用通用文案。
  function clearUserAPIKey(name, providerId) {
    var providerName = providerDisplayName(providerId) || providerId;
    var confirmText = providerName ?
      "确认清除 \"" + name + "\" 的 " + providerName + " 专属 API Key？\n" +
      "其 agent 将退出 " + providerName + " 登录并回退到内置/环境变量凭据。" :
      "确认清除 \"" + name + "\" 的专属 API Key？\n" +
      "该用户当前未存储专属 Key，清除操作不会改变其凭据来源。";
    if (!window.confirm(confirmText)) {
      return;
    }
    clearMsg();
    fetch("api/users/" + encodeURIComponent(name) + "/apikey", { method: "DELETE" })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("用户 " + esc(j.name || name) + "：" + (j.message || "Key 已清除"));
        listUsers();
      })
      .catch(function (err) {
        showMsg("清除 Key 失败：" + err.message, true);
      });
  }

  // setUserExpiry prompts for an activation duration (e.g. "168h") and stores
  // it as the user's expiry; the server computes the absolute expiry timestamp.
  // A blank or "0"/"0h" input clears the expiry instead.
  function setUserExpiry(name) {
    var current = window.prompt(
      "为 \"" + name + "\" 设置激活有效期（到期后自动挂起释放资源，数据保留可恢复）。\n" +
      "输入持续时长，如 24h / 168h / 30m；输入 0 或留空表示清除。", "168h");
    if (current === null) {
      return; // 用户取消
    }
    var trimmed = current.trim();
    if (trimmed === "" || trimmed === "0" || /^0+[a-z]*$/i.test(trimmed)) {
      clearUserExpiry(name);
      return;
    }
    clearMsg();
    fetch("api/users/" + encodeURIComponent(name) + "/expiry", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ duration: trimmed })
    })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("用户 " + esc(j.name || name) + "：有效期限已设置，到期时间 " + (j.expiresAt || ""));
        listUsers();
      })
      .catch(function (err) {
        showMsg("设置有效期失败：" + err.message, true);
      });
  }

  function clearUserExpiry(name) {
    clearMsg();
    fetch("api/users/" + encodeURIComponent(name) + "/expiry", { method: "DELETE" })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("用户 " + esc(j.name || name) + "：" + (j.message || "有效期限已清除"));
        listUsers();
      })
      .catch(function (err) {
        showMsg("清除有效期失败：" + err.message, true);
      });
  }

  // setUserTier prompts for one of the fixed resource tiers (small/mid/large)
  // and stores it; it only affects the user's next fresh create/recreate.
  function setUserTier(name, currentTier) {
    var tier = window.prompt(
      "为 \"" + name + "\" 设置资源档位（small / mid / large）。\n" +
      "档位将在下次新建/重建该用户时生效（存量用户保持不变）。" +
      (currentTier ? "\n当前档位：" + currentTier : ""), currentTier || "small");
    if (tier === null) {
      return; // 用户取消
    }
    tier = tier.trim().toLowerCase();
    if (["small", "mid", "large"].indexOf(tier) === -1) {
      showMsg("非法资源档位：可选 small / mid / large", true);
      return;
    }
    clearMsg();
    fetch("api/users/" + encodeURIComponent(name) + "/tier", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tier: tier })
    })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("用户 " + esc(j.name || name) + "：" + (j.message || ("资源档位已设为 " + tier)));
        listUsers();
      })
      .catch(function (err) {
        showMsg("设置资源档位失败：" + err.message, true);
      });
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    // 回退方案：部分浏览器在非安全上下文（http）下禁用 Clipboard API。
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        ok ? resolve() : reject(new Error("复制失败"));
      } catch (e) {
        reject(e);
      }
    });
  }

  function copyPassword(name) {
    if (!window.confirm("确认重置用户 \"" + name + "\" 的访问密码并复制到剪贴板？旧密码将立即失效。")) {
      return;
    }
    clearMsg();
    fetch("api/users/" + encodeURIComponent(name) + "/password", { method: "POST" })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        return copyToClipboard(j.password).then(function () {
          showMsg("用户 " + esc(j.name) + " 的访问密码已生成并复制到剪贴板：" +
            j.password + "（仅显示一次）");
        }, function () {
          // 复制失败也照常显示，方便手动复制。
          showMsg("用户 " + esc(j.name) + " 的访问密码：" + j.password +
            "（已生成但自动复制失败，请手动复制）");
        });
      })
      .catch(function (err) {
        showMsg("复制密码失败：" + err.message, true);
      });
  }

  function resetPassword(name) {
    if (!window.confirm("确认重置用户 \"" + name + "\" 的访问密码？旧密码将立即失效。")) {
      return;
    }
    clearMsg();
    fetch("api/users/" + encodeURIComponent(name) + "/password", { method: "POST" })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("用户 " + esc(j.name) + " 的新访问密码：" + j.password +
          "（仅显示一次，请立即复制并告知用户）");
      })
      .catch(function (err) {
        showMsg("重置密码失败：" + err.message, true);
      });
  }

  function createUser(name) {
    clearMsg();
    fetch("api/users", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name })
    })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        var msg = "添加用户：" + (j.message || "成功");
        if (j.password) {
          msg += "；访问密码：" + j.password + "（仅显示一次，请立即复制并告知用户）";
        }
        showMsg(msg);
        document.getElementById("name-input").value = "";
        listUsers();
      })
      .catch(function (err) {
        showMsg("添加失败：" + err.message, true);
      });
  }

  // ---- 共享 Skills ----

  function fmtSize(bytes) {
    if (bytes == null || bytes < 0) return "—";
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(2) + " MB";
  }

  function fmtTime(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString();
  }

  function renderSkills(skills) {
    var table = document.getElementById("skill-table");
    var empty = document.getElementById("skill-empty");
    var body = document.getElementById("skill-body");
    body.innerHTML = "";
    if (!skills || skills.length === 0) {
      table.style.display = "none";
      empty.style.display = "block";
      return;
    }
    table.style.display = "table";
    empty.style.display = "none";
    skills.forEach(function (s) {
      var tr = document.createElement("tr");
      tr.innerHTML =
        '<td class="mono">' + esc(s.name) + "</td>" +
        "<td>" + esc(fmtSize(s.size)) + "</td>" +
        "<td>" + esc(fmtTime(s.updatedAt)) + "</td>" +
        '<td class="actions"><button class="danger mini skill-del" title="卸载该 skill（仅删除管理员托管的副本，不影响用户自建同名 skill）">删除</button></td>';
      tr.querySelector(".skill-del").addEventListener("click", function () {
        deleteSkill(s.name);
      });
      body.appendChild(tr);
    });
  }

  function listSkills() {
    fetch("api/skills")
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (data) {
        renderSkills(data.skills);
      })
      .catch(function (err) {
        showMsg("读取共享 Skills 失败：" + err.message, true);
      });
  }

  function uploadSkill(name, file) {
    clearMsg();
    var formData = new FormData();
    formData.append("name", name);
    formData.append("file", file, file.name);
    var btn = document.getElementById("skill-upload-btn");
    btn.disabled = true;
    btn.textContent = "上传中…";
    fetch("api/skills", { method: "POST", body: formData })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("已安装共享 Skill：" + (j.skill ? j.skill.name : name) +
          (j.skill && j.skill.size ? "（" + fmtSize(j.skill.size) + "）" : "") +
          "，约 10 秒内分发到所有用户");
        document.getElementById("skill-file-input").value = "";
        listSkills();
      })
      .catch(function (err) {
        showMsg("上传 Skill 失败：" + err.message, true);
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = "上传";
      });
  }

  function deleteSkill(name) {
    if (!window.confirm("确认卸载共享 Skill \"" + name + "\"？\n" +
        "将删除管理员托管的副本并通知所有用户移除；用户自建且未被托管的同名 skill 不会受影响。")) {
      return;
    }
    clearMsg();
    fetch("api/skills/" + encodeURIComponent(name), { method: "DELETE" })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("已卸载共享 Skill：" + (j.message || name));
        listSkills();
      })
      .catch(function (err) {
        showMsg("卸载 Skill 失败：" + err.message, true);
      });
  }

  function applySkills() {
    clearMsg();
    var btn = document.getElementById("apply-skills-btn");
    var note = document.getElementById("apply-note");
    btn.disabled = true;
    btn.textContent = "应用中…";
    note.textContent = "";
    fetch("api/skills/apply", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}"
    })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        if (j.error) {
          showMsg("立即应用失败：" + j.error, true);
          return;
        }
        var ok = j.failed === 0;
        showMsg("立即应用完成：已将新 Skill 应用到 " + j.reloaded + " 个在线会话（" +
          j.online + " 个在线用户）" + (j.failed > 0 ? "，" + j.failed + " 个用户未成功，将在下次开会话生效" : ""));
        if (j.failures && j.failures.length) {
          note.textContent = "未成功：" + j.failures.slice(0, 3).join("；") +
            (j.failures.length > 3 ? " 等" : "");
          note.style.color = "var(--danger)";
        } else {
          note.textContent = "已应用到 " + j.reloaded + "/" + j.online + " 个在线用户";
          note.style.color = "var(--green)";
        }
      })
      .catch(function (err) {
        showMsg("立即应用失败：" + err.message, true);
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = "立即应用";
      });
  }

  document.getElementById("skill-upload-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = document.getElementById("skill-name-input").value.trim();
    var fileInput = document.getElementById("skill-file-input");
    if (!/^[a-z0-9]([-a-z0-9]*[a-z0-9])?$/.test(name)) {
      showMsg("非法 skill 名称：必须匹配 DNS-1123（小写字母、数字、中划线）", true);
      return;
    }
    if (!fileInput.files || !fileInput.files[0]) {
      showMsg("请先选择要上传的 .tgz / .zip 文件", true);
      return;
    }
    uploadSkill(name, fileInput.files[0]);
  });

  document.getElementById("apply-skills-btn").addEventListener("click", applySkills);

  document.getElementById("add-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = document.getElementById("name-input");
    var name = input.value.trim();
    if (!/^[a-z0-9]([-a-z0-9]*[a-z0-9])?$/.test(name)) {
      showMsg("非法用户名：必须匹配 DNS-1123（小写字母、数字、中划线）", true);
      return;
    }
    createUser(name);
  });

  document.getElementById("refresh-btn").addEventListener("click", listUsers);

  // 点击其他区域时关闭已打开的下拉菜单。
  document.addEventListener("click", function () {
    closeAllDropdowns();
    openMenuUser = null;
  });

  // 滚动时关闭菜单：菜单为 fixed 定位，页面/卡片滚动后按钮位置会变化，
  // 留在原处的菜单会与按钮错位。
  window.addEventListener("scroll", function () {
    closeAllDropdowns();
    openMenuUser = null;
  }, true);

  listProviders();
  listUsers();
  listSkills();
  setInterval(listUsers, 5000);
})();
</script>
</body>
