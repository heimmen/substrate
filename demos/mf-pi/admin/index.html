      '<div class="modal-note" id="key-provider-note"></div>' +
      '<div class="modal-hint">Key 会写入 Secret 持久化并注入到该用户运行中的 agent；' +
      "若 agent 尚未恢复将自动恢复。本页只设置该用户的凭据，端点由「模型端点」标签页维护。</div>" +
      '<div class="modal-error" id="key-error"></div>' +
      '<div class="modal-actions">' +
      '<button class="secondary" id="key-cancel">关闭</button>' +
      '<button class="danger" id="key-clear" disabled>清除 Key</button>' +
      '<button id="key-ok">保存</button>' +
      "</div>" +
      "</div>" +
      "</div>";

    // 标签页切换（role=tablist / tab / tabpanel；左右方向键与 Home/End 也可切换）。
    var tabs = root.querySelectorAll('[role="tab"]');
    Array.prototype.forEach.call(tabs, function (t) {
      t.addEventListener("click", function () {
        showSettingsTab(root, t.id);
      });
      t.addEventListener("keydown", function (e) {
        var key = e.key || "";
        var idx = Array.prototype.indexOf.call(tabs, t);
        var next = -1;
        if (key === "ArrowRight" || e.keyCode === 39) next = (idx + 1) % tabs.length;
        else if (key === "ArrowLeft" || e.keyCode === 37) next = (idx - 1 + tabs.length) % tabs.length;
        else if (key === "Home" || e.keyCode === 36) next = 0;
        else if (key === "End" || e.keyCode === 35) next = tabs.length - 1;
        if (next < 0) return;
        e.preventDefault();
        showSettingsTab(root, tabs[next].id);
        tabs[next].focus();
      });
    });

    root.querySelector("#endpoint-cancel").addEventListener("click", closeModelSettings);
    root.querySelector("#endpoint-ok").addEventListener("click", function () {
      submitEndpoint(root);
    });
    root.querySelector("#endpoint-add-model").addEventListener("click", function () {
      var row = addModelRow(root, null);
      refreshEndpointForm(root);
      row.querySelector(".model-id").focus();
    });
    root.querySelector("#endpoint-discover").addEventListener("click", function () {
      discoverModels(root);
    });
    root.querySelector("#endpoint-id").addEventListener("input", function () {
      refreshEndpointForm(root);
    });
    root.querySelector("#endpoint-baseurl").addEventListener("input", function () {
      clearDiscoverNote(root);
      refreshEndpointForm(root);
    });
    root.querySelector("#endpoint-api").addEventListener("change", function () {
      // 只更新占位地址，保留管理员已经输入的地址。
      root.querySelector("#endpoint-baseurl").placeholder = apiBaseUrlPlaceholder(this.value);
      clearDiscoverNote(root);
      refreshEndpointForm(root);
    });

    // 用户 API Key 标签页：用户 / provider 变化都重算提示与「清除 Key」可用性。
    root.querySelector("#key-user-select").addEventListener("change", function () {
      root.querySelector("#key-error").textContent = "";
      syncKeyProviderToUser();
    });
    root.querySelector("#key-provider-select").addEventListener("change", function () {
      root.querySelector("#key-error").textContent = "";
      refreshKeyTabState();
    });
    root.querySelector("#key-clear").addEventListener("click", clearKeyTab);
    root.querySelector("#key-ok").addEventListener("click", saveKeyTab);
    root.querySelector("#key-input").addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.keyCode === 13) {
        e.preventDefault();
        saveKeyTab();
      }
    });
    root.querySelector("#key-cancel").addEventListener("click", closeModelSettings);

    // 仅在遮罩上按下并松开时才关闭，避免在输入框内选中文字后拖到遮罩上误关闭。
    var overlayPressed = false;
    root.addEventListener("mousedown", function (e) {
      overlayPressed = e.target === root;
    });
    root.addEventListener("click", function (e) {
      if (e.target === root && overlayPressed) closeModelSettings();
    });
    document.addEventListener("keydown", onModelSettingsKeydown, true);

    document.body.appendChild(root);
    modelSettingsEl = root;
    root.querySelector("#endpoint-id").focus();
    // 初始化状态：Provider ID 提示、显示名称占位符，模型目录为空时保存按钮禁用。
    refreshEndpointForm(root);
    // 填充内置 / 自定义端点列表与「用户 API Key」的 provider 下拉；fetchProviders 失败时
    // 只用兜底列表，自定义端点列表显示空态。
    loadEndpoints(false);
  }

  // ---- 标签页 2：用户 API Key（每用户凭据） ----

  // keyTabUsers 缓存「用户 API Key」标签页的用户下拉数据（name -> 用户摘要），用于计算
  // 提示文案与「清除 Key」的可用性；每次显示该标签页时重新拉取 api/users。
  var keyTabUsers = {};

  // loadKeyTabUsers 拉取 api/users 并重建用户下拉：保留已选用户，未选时保持「请选择用户」
  // 占位项（保存时会拦住空值）。失败只写标签页内联错误，不影响页面其它部分。
  function loadKeyTabUsers() {
    var root = modelSettingsEl;
    if (!root) return;
    if (!root.querySelector("#key-user-select")) return;
    fetch("api/users")
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (data) {
        if (root !== modelSettingsEl) return; // 对话框已关闭或已重开，丢弃本次结果
        var select = root.querySelector("#key-user-select");
        if (!select) return;
        var prev = select.value;
        var users = (data && data.users) || [];
        keyTabUsers = {};
        select.innerHTML = '<option value="">请选择用户</option>';
        users.forEach(function (u) {
          keyTabUsers[u.name] = u;
          var opt = document.createElement("option");
          opt.value = u.name;
          opt.textContent = u.name;
          select.appendChild(opt);
        });
        if (prev && keyTabUsers[prev]) select.value = prev;
        syncKeyProviderToUser();
      })
      .catch(function (err) {
        if (root !== modelSettingsEl) return;
        var error = root.querySelector("#key-error");
        if (error) error.textContent = "读取用户列表失败：" + err.message;
      });
  }

  // ensureKeyProviderOption 保证 provider 下拉里存在 id 选项：用户已存储的 provider 可能
  // 已被删除、不在部署列表中，补一项以免选不中、无法按旧 provider 执行切换/清除。
  function ensureKeyProviderOption(select, id) {
    if (!id) return;
    for (var i = 0; i < select.options.length; i++) {
      if (select.options[i].value === id) return;
    }
    var opt = document.createElement("option");
    opt.value = id;
    opt.textContent = providerDisplayName(id);
    select.insertBefore(opt, select.firstChild);
  }

  // keyTabStoredProvider 返回当前选中用户已存储的 provider id（未设置则为空串）。
  function keyTabStoredProvider() {
    if (!modelSettingsEl) return "";
    var select = modelSettingsEl.querySelector("#key-user-select");
    var u = select ? keyTabUsers[select.value] : null;
    if (!u || !u.hasPersonalKey) return "";
    return u.personalKeyProvider || "";
  }

  // syncKeyProviderToUser 把 provider 下拉切到所选用户已存储的 provider（与旧对话框一致）：
  // 该 provider 已从部署列表删除时补一项，保证仍能显示提示并执行清除；随后重算提示文案。
  function syncKeyProviderToUser() {
    if (!modelSettingsEl) return;
    var select = modelSettingsEl.querySelector("#key-provider-select");
    if (!select) return;
    var stored = keyTabStoredProvider();
    if (stored) {
      ensureKeyProviderOption(select, stored);
      select.value = stored;
    }
    refreshKeyTabState();
  }

  // refreshKeyTabState 重算「用户 API Key」的提示与「清除 Key」可用性：未选用户 → 提示
  // 清空、清除禁用；未设置 → 说明保存后会使用所选 provider；已设置 → 覆盖或切换提示。
  function refreshKeyTabState() {
    if (!modelSettingsEl) return;
    var userSelect = modelSettingsEl.querySelector("#key-user-select");
    var providerSelect = modelSettingsEl.querySelector("#key-provider-select");
    var note = modelSettingsEl.querySelector("#key-provider-note");
    var clearBtn = modelSettingsEl.querySelector("#key-clear");
    if (!userSelect || !providerSelect || !note || !clearBtn) return;
    var u = keyTabUsers[userSelect.value];
    clearBtn.disabled = !(u && u.hasPersonalKey);
    if (!u) {
      note.textContent = "";
      return;
    }
    var stored = u.hasPersonalKey ? (u.personalKeyProvider || "") : "";
    if (!stored) {
      note.textContent = "该用户当前未设置专属 Key；保存后将使用所选的 provider。";
      return;
    }
    var storedName = providerDisplayName(stored);
    if (providerSelect.value === stored) {
      note.textContent = "当前已设置：" + storedName + "（保存后将覆盖现有 Key）";
    } else {
      note.textContent = "当前已设置：" + storedName + "（保存后将切换并退出旧 provider）";
    }
  }

  // fillKeyProviderSelect 用 provider 列表重填「用户 API Key」的 provider 下拉：自定义端点加
  // 「（自定义）」后缀；保留当前选择，用户已存储但已下架的 provider 会补一项。
  function fillKeyProviderSelect(list) {
    if (!modelSettingsEl) return;
    var select = modelSettingsEl.querySelector("#key-provider-select");
    if (!select) return;
    var prev = select.value;
    select.innerHTML = "";
    (list || []).forEach(function (p) {
      var opt = document.createElement("option");
      opt.value = p.id;
      opt.textContent = p.name + (p.custom ? "（自定义）" : "");
      select.appendChild(opt);
    });
    var wanted = prev || keyTabStoredProvider() || "";
    if (!wanted && select.options.length) wanted = select.options[0].value;
    if (wanted) {
      ensureKeyProviderOption(select, wanted);
      select.value = wanted;
    }
    select.disabled = select.options.length === 0;
    refreshKeyTabState();
  }

  // saveKeyTab 校验用户与非空 Key 后提交：成功后清空输入框并刷新用户摘要（提示与「清除
  // Key」随之更新）；失败保留已输入的 Key，便于直接重试。
  function saveKeyTab() {
    var root = modelSettingsEl;
    if (!root) return;
    var userSelect = root.querySelector("#key-user-select");
    var providerSelect = root.querySelector("#key-provider-select");
    var input = root.querySelector("#key-input");
    var error = root.querySelector("#key-error");
    if (!userSelect || !providerSelect || !input || !error) return;
    var name = userSelect.value;
    if (name === "") {
      error.textContent = "请先选择用户";
      userSelect.focus();
      return;
    }
    if (providerSelect.disabled || providerSelect.value === "") {
      error.textContent = "Provider 列表加载中，请稍候…";
      return;
    }
    var key = input.value.trim();
    if (key === "") {
      error.textContent = "API Key 不能为空";
      input.focus();
      return;
    }
    error.textContent = "";
    submitUserAPIKey(name, key, providerSelect.value, function () {
      if (root !== modelSettingsEl) return;
      if (input.value.trim() === key) input.value = "";
      loadKeyTabUsers(); // 刷新用户摘要，使提示与「清除 Key」反映新状态
    });
  }

  // clearKeyTab 清除所选用户的专属 Key：确认文案由 clearUserAPIKey 按该用户实际存储的
  // provider 生成；成功后刷新用户摘要（用户表的 Key 徽标由 clearUserAPIKey 内部 listUsers 更新）。
  function clearKeyTab() {
    var root = modelSettingsEl;
    if (!root) return;
    var userSelect = root.querySelector("#key-user-select");
    if (!userSelect || userSelect.value === "") return;
    var name = userSelect.value;
    var u = keyTabUsers[name];
    if (!u || !u.hasPersonalKey) return;
    clearUserAPIKey(name, u.personalKeyProvider || "", function () {
      loadKeyTabUsers();
    });
  }

  // clearUserAPIKey 清除该用户的专属 Key；确认文案按用户实际配置的 provider 命名，
  // 未配置时使用通用文案。done 是可选回调：成功后调用，让「用户 API Key」标签页刷新用户摘要。
  function clearUserAPIKey(name, providerId, done) {
    var providerName = providerDisplayName(providerId) || providerId;
    var confirmText = providerName ?
      "确认清除 \"" + name + "\" 的 " + providerName + " 专属 API Key？\n" +
      "其 agent 将退出 " + providerName + " 登录并回退到内置/环境变量凭据。" :
      "确认清除 \"" + name + "\" 的专属 API Key？\n" +
      "该用户当前未存储专属 Key，清除操作不会改变其凭据来源。";
    if (!window.confirm(confirmText)) {
      return;
    }
    clearMsg();
    fetch("api/users/" + encodeURIComponent(name) + "/apikey", { method: "DELETE" })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("用户 " + esc(j.name || name) + "：" + (j.message || "Key 已清除"));
        listUsers();
        if (done) done();
      })
      .catch(function (err) {
        showMsg("清除 Key 失败：" + err.message, true);
      });
  }

  // setUserExpiry prompts for an activation duration (e.g. "168h") and stores
  // it as the user's expiry; the server computes the absolute expiry timestamp.
  // A blank or "0"/"0h" input clears the expiry instead.
  function setUserExpiry(name) {
    var current = window.prompt(
      "为 \"" + name + "\" 设置激活有效期（到期后自动挂起释放资源，数据保留可恢复）。\n" +
      "输入持续时长，如 24h / 168h / 30m；输入 0 或留空表示清除。", "168h");
    if (current === null) {
      return; // 用户取消
    }
    var trimmed = current.trim();
    if (trimmed === "" || trimmed === "0" || /^0+[a-z]*$/i.test(trimmed)) {
      clearUserExpiry(name);
      return;
    }
    clearMsg();
    fetch("api/users/" + encodeURIComponent(name) + "/expiry", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ duration: trimmed })
    })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("用户 " + esc(j.name || name) + "：有效期限已设置，到期时间 " + (j.expiresAt || ""));
        listUsers();
      })
      .catch(function (err) {
        showMsg("设置有效期失败：" + err.message, true);
      });
  }

  function clearUserExpiry(name) {
    clearMsg();
    fetch("api/users/" + encodeURIComponent(name) + "/expiry", { method: "DELETE" })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("用户 " + esc(j.name || name) + "：" + (j.message || "有效期限已清除"));
        listUsers();
      })
      .catch(function (err) {
        showMsg("清除有效期失败：" + err.message, true);
      });
  }

  // setUserTier prompts for one of the fixed resource tiers (small/mid/large)
  // and stores it; it only affects the user's next fresh create/recreate.
  function setUserTier(name, currentTier) {
    var tier = window.prompt(
      "为 \"" + name + "\" 设置资源档位（small / mid / large）。\n" +
      "档位将在下次新建/重建该用户时生效（存量用户保持不变）。" +
      (currentTier ? "\n当前档位：" + currentTier : ""), currentTier || "small");
    if (tier === null) {
      return; // 用户取消
    }
    tier = tier.trim().toLowerCase();
    if (["small", "mid", "large"].indexOf(tier) === -1) {
      showMsg("非法资源档位：可选 small / mid / large", true);
      return;
    }
    clearMsg();
    fetch("api/users/" + encodeURIComponent(name) + "/tier", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tier: tier })
    })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("用户 " + esc(j.name || name) + "：" + (j.message || ("资源档位已设为 " + tier)));
        listUsers();
      })
      .catch(function (err) {
        showMsg("设置资源档位失败：" + err.message, true);
      });
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    // 回退方案：部分浏览器在非安全上下文（http）下禁用 Clipboard API。
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        ok ? resolve() : reject(new Error("复制失败"));
      } catch (e) {
        reject(e);
      }
    });
  }

  function copyPassword(name) {
    if (!window.confirm("确认重置用户 \"" + name + "\" 的访问密码并复制到剪贴板？旧密码将立即失效。")) {
      return;
    }
    clearMsg();
    fetch("api/users/" + encodeURIComponent(name) + "/password", { method: "POST" })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        return copyToClipboard(j.password).then(function () {
          showMsg("用户 " + esc(j.name) + " 的访问密码已生成并复制到剪贴板：" +
            j.password + "（仅显示一次）");
        }, function () {
          // 复制失败也照常显示，方便手动复制。
          showMsg("用户 " + esc(j.name) + " 的访问密码：" + j.password +
            "（已生成但自动复制失败，请手动复制）");
        });
      })
      .catch(function (err) {
        showMsg("复制密码失败：" + err.message, true);
      });
  }

  function resetPassword(name) {
    if (!window.confirm("确认重置用户 \"" + name + "\" 的访问密码？旧密码将立即失效。")) {
      return;
    }
    clearMsg();
    fetch("api/users/" + encodeURIComponent(name) + "/password", { method: "POST" })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("用户 " + esc(j.name) + " 的新访问密码：" + j.password +
          "（仅显示一次，请立即复制并告知用户）");
      })
      .catch(function (err) {
        showMsg("重置密码失败：" + err.message, true);
      });
  }

  function createUser(name) {
    clearMsg();
    fetch("api/users", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name })
    })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        var msg = "添加用户：" + (j.message || "成功");
        if (j.password) {
          msg += "；访问密码：" + j.password + "（仅显示一次，请立即复制并告知用户）";
        }
        showMsg(msg);
        document.getElementById("name-input").value = "";
        listUsers();
      })
      .catch(function (err) {
        showMsg("添加失败：" + err.message, true);
      });
  }

  // ---- 共享 Skills ----

  function fmtSize(bytes) {
    if (bytes == null || bytes < 0) return "—";
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(2) + " MB";
  }

  function fmtTime(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString();
  }

  function renderSkills(skills) {
    var table = document.getElementById("skill-table");
    var empty = document.getElementById("skill-empty");
    var body = document.getElementById("skill-body");
    body.innerHTML = "";
    if (!skills || skills.length === 0) {
      table.style.display = "none";
      empty.style.display = "block";
      return;
    }
    table.style.display = "table";
    empty.style.display = "none";
    skills.forEach(function (s) {
      var tr = document.createElement("tr");
      tr.innerHTML =
        '<td class="mono">' + esc(s.name) + "</td>" +
        "<td>" + esc(fmtSize(s.size)) + "</td>" +
        "<td>" + esc(fmtTime(s.updatedAt)) + "</td>" +
        '<td class="actions"><button class="danger mini skill-del" title="卸载该 skill（仅删除管理员托管的副本，不影响用户自建同名 skill）">删除</button></td>';
      tr.querySelector(".skill-del").addEventListener("click", function () {
        deleteSkill(s.name);
      });
      body.appendChild(tr);
    });
  }

  function listSkills() {
    fetch("api/skills")
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (data) {
        renderSkills(data.skills);
      })
      .catch(function (err) {
        showMsg("读取共享 Skills 失败：" + err.message, true);
      });
  }

  function uploadSkill(name, file) {
    clearMsg();
    var formData = new FormData();
    formData.append("name", name);
    formData.append("file", file, file.name);
    var btn = document.getElementById("skill-upload-btn");
    btn.disabled = true;
    btn.textContent = "上传中…";
    fetch("api/skills", { method: "POST", body: formData })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("已安装共享 Skill：" + (j.skill ? j.skill.name : name) +
          (j.skill && j.skill.size ? "（" + fmtSize(j.skill.size) + "）" : "") +
          "，约 10 秒内分发到所有用户");
        document.getElementById("skill-file-input").value = "";
        listSkills();
      })
      .catch(function (err) {
        showMsg("上传 Skill 失败：" + err.message, true);
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = "上传";
      });
  }

  function deleteSkill(name) {
    if (!window.confirm("确认卸载共享 Skill \"" + name + "\"？\n" +
        "将删除管理员托管的副本并通知所有用户移除；用户自建且未被托管的同名 skill 不会受影响。")) {
      return;
    }
    clearMsg();
    fetch("api/skills/" + encodeURIComponent(name), { method: "DELETE" })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("已卸载共享 Skill：" + (j.message || name));
        listSkills();
      })
      .catch(function (err) {
        showMsg("卸载 Skill 失败：" + err.message, true);
      });
  }

  function applySkills() {
    clearMsg();
    var btn = document.getElementById("apply-skills-btn");
    var note = document.getElementById("apply-note");
    btn.disabled = true;
    btn.textContent = "应用中…";
    note.textContent = "";
    fetch("api/skills/apply", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}"
    })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        if (j.error) {
          showMsg("立即应用失败：" + j.error, true);
          return;
        }
        var ok = j.failed === 0;
        showMsg("立即应用完成：已将新 Skill 应用到 " + j.reloaded + " 个在线会话（" +
          j.online + " 个在线用户）" + (j.failed > 0 ? "，" + j.failed + " 个用户未成功，将在下次开会话生效" : ""));
        if (j.failures && j.failures.length) {
          note.textContent = "未成功：" + j.failures.slice(0, 3).join("；") +
            (j.failures.length > 3 ? " 等" : "");
          note.style.color = "var(--danger)";
        } else {
          note.textContent = "已应用到 " + j.reloaded + "/" + j.online + " 个在线用户";
          note.style.color = "var(--green)";
        }
      })
      .catch(function (err) {
        showMsg("立即应用失败：" + err.message, true);
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = "立即应用";
      });
  }

  document.getElementById("skill-upload-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = document.getElementById("skill-name-input").value.trim();
    var fileInput = document.getElementById("skill-file-input");
    if (!/^[a-z0-9]([-a-z0-9]*[a-z0-9])?$/.test(name)) {
      showMsg("非法 skill 名称：必须匹配 DNS-1123（小写字母、数字、中划线）", true);
      return;
    }
    if (!fileInput.files || !fileInput.files[0]) {
      showMsg("请先选择要上传的 .tgz / .zip 文件", true);
      return;
    }
    uploadSkill(name, fileInput.files[0]);
  });

  document.getElementById("apply-skills-btn").addEventListener("click", applySkills);

  document.getElementById("add-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = document.getElementById("name-input");
    var name = input.value.trim();
    if (!/^[a-z0-9]([-a-z0-9]*[a-z0-9])?$/.test(name)) {
      showMsg("非法用户名：必须匹配 DNS-1123（小写字母、数字、中划线）", true);
      return;
    }
    createUser(name);
  });

  document.getElementById("refresh-btn").addEventListener("click", listUsers);
  document.getElementById("model-settings-btn").addEventListener("click", openModelSettings);

  // 点击其他区域时关闭已打开的下拉菜单。
  document.addEventListener("click", function () {
    closeAllDropdowns();
    openMenuUser = null;
  });

  // 滚动时关闭菜单：菜单为 fixed 定位，页面/卡片滚动后按钮位置会变化，
  // 留在原处的菜单会与按钮错位。
  window.addEventListener("scroll", function () {
    closeAllDropdowns();
    openMenuUser = null;
  }, true);

  listProviders();
  listUsers();
  listSkills();
  setInterval(listUsers, 5000);
})();
</script>
</body>
</html>
