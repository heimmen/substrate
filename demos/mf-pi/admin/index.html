      // 锁定白名单：勾选后该端点的模型列表成为封闭集合；取消勾选是唯一的解锁路径。
      '<div class="endpoint-pinned">' +
      '<label class="endpoint-pinned-label" for="endpoint-pinned">' +
      '<input type="checkbox" id="endpoint-pinned" /> 锁定模型列表（白名单）</label>' +
      '<div class="modal-hint" id="endpoint-pinned-hint">勾选后该端点的模型列表视为封闭集合：' +
      "探测结果里不在其中的模型不可选，编辑时也无法手工加入白名单之外的模型。" +
      "要扩展列表，请先取消勾选并保存，再重新勾选。</div>" +
      "</div>" +
      '<div class="endpoint-section-head">' +
      '<span class="modal-label">模型目录 *</span>' +
      '<button class="secondary mini" id="endpoint-discover">获取可用模型</button>' +
      "</div>" +
      '<div class="endpoint-rows" id="endpoint-rows"></div>' +
      '<div class="endpoint-rows-actions">' +
      '<button class="secondary mini" id="endpoint-add-model">添加模型</button>' +
      '<span class="modal-hint" id="endpoint-catalog-note"></span>' +
      "</div>" +
      '<div class="modal-error" id="endpoint-model-error"></div>' +
      "</div>" +
      '<div id="endpoint-json-wrap" hidden>' +
      '<div class="endpoint-section-head">' +
      '<label class="modal-label" for="endpoint-json">端点配置（JSON）</label>' +
      '<button type="button" class="secondary mini" id="endpoint-json-example">填入 DeepSeek 示例</button>' +
      "</div>" +
      '<textarea id="endpoint-json" class="json-editor" spellcheck="false"></textarea>' +
      '<div class="modal-hint">字段与「保存端点」的请求体一致：<code>id</code>（可选；编辑时不可修改）、' +
      "<code>name</code>、<code>baseUrl</code>（必填）、<code>api</code>（缺省 openai-completions）、" +
      "<code>pinned</code>、<code>models</code>（至少一个，每项至少 <code>id</code>）。" +
      "可选的 <code>apiKey</code> 仅用于探测，不会保存。</div>" +
      '<div class="modal-error" id="endpoint-json-error"></div>' +
      "</div>" +
      '<div class="modal-error" id="endpoint-error"></div>' +
      '<div class="modal-actions">' +
      '<button class="secondary" id="endpoint-cancel">取消</button>' +
      '<button id="endpoint-ok">保存端点</button>' +
      "</div>" +
      "</div>" +
      // 标签页 2：用户 API Key（每用户凭据，可一次应用到所有用户）。
      '<div class="tab-panel" id="settings-panel-userkey" role="tabpanel" aria-labelledby="settings-tab-userkey" hidden>' +
      '<label class="modal-label">应用范围</label>' +
      '<div class="mode-switch" role="group" aria-label="应用范围">' +
      '<button type="button" class="mode-btn" id="key-scope-all" aria-pressed="true">所有用户（<span id="key-all-count">…</span>）</button>' +
      '<button type="button" class="mode-btn" id="key-scope-pick" aria-pressed="false">指定用户</button>' +
      "</div>" +
      '<div id="key-user-picker" hidden>' +
      '<div class="endpoint-rows-actions">' +
      '<button type="button" class="secondary mini" id="key-pick-all">全选</button>' +
      '<button type="button" class="secondary mini" id="key-pick-none">全不选</button>' +
      '<span class="modal-hint" id="key-pick-count"></span>' +
      "</div>" +
      '<div class="user-picker" id="key-user-list"><div class="endpoint-empty">正在加载…</div></div>' +
      "</div>" +
      '<label class="modal-label" for="key-provider-select">Provider</label>' +
      '<select id="key-provider-select"><option value="">加载中…</option></select>' +
      '<label class="modal-label" for="key-input">API Key</label>' +
      '<input type="text" id="key-input" placeholder="sk-..." autocomplete="off" spellcheck="false" />' +
      '<div class="modal-hint">Key 按用户分别持久化：运行中的 agent 立即注入；挂起的用户会在恢复后自动生效。' +
      "本页只设置凭据，端点由「模型端点」标签页维护。</div>" +
      '<div class="batch-result" id="key-result"></div>' +
      '<div class="modal-error" id="key-error"></div>' +
      '<div class="modal-actions">' +
      '<button class="secondary" id="key-cancel">关闭</button>' +
      '<button class="danger" id="key-clear" disabled>清除所选用户的 Key</button>' +
      '<button id="key-ok">保存到所选用户</button>' +
      "</div>" +
      "</div>" +
      "</div>";

    // 标签页切换（role=tablist / tab / tabpanel；左右方向键与 Home/End 也可切换）。
    var tabs = root.querySelectorAll('[role="tab"]');
    Array.prototype.forEach.call(tabs, function (t) {
      t.addEventListener("click", function () {
        showSettingsTab(root, t.id);
      });
      t.addEventListener("keydown", function (e) {
        var key = e.key || "";
        var idx = Array.prototype.indexOf.call(tabs, t);
        var next = -1;
        if (key === "ArrowRight" || e.keyCode === 39) next = (idx + 1) % tabs.length;
        else if (key === "ArrowLeft" || e.keyCode === 37) next = (idx - 1 + tabs.length) % tabs.length;
        else if (key === "Home" || e.keyCode === 36) next = 0;
        else if (key === "End" || e.keyCode === 35) next = tabs.length - 1;
        if (next < 0) return;
        e.preventDefault();
        showSettingsTab(root, tabs[next].id);
        tabs[next].focus();
      });
    });

    root.querySelector("#endpoint-cancel").addEventListener("click", closeModelSettings);
    root.querySelector("#endpoint-ok").addEventListener("click", function () {
      submitEndpoint(root);
    });
    // 取消编辑：退回空白的新增端点表单（重新启用 Provider ID、清空各行与错误）。
    root.querySelector("#endpoint-edit-cancel").addEventListener("click", function () {
      resetEndpointForm(root);
    });
    // 锁定复选框：勾选 / 取消勾选会改变逐行校验结果（取消勾选即解锁），立刻重算。
    root.querySelector("#endpoint-pinned").addEventListener("change", function () {
      refreshEndpointForm(root);
    });
    root.querySelector("#endpoint-add-model").addEventListener("click", function () {
      var row = addModelRow(root, null);
      refreshEndpointForm(root);
      row.querySelector(".model-id").focus();
    });
    root.querySelector("#endpoint-discover").addEventListener("click", function () {
      discoverModels(root);
    });
    root.querySelector("#endpoint-id").addEventListener("input", function () {
      refreshEndpointForm(root);
    });
    root.querySelector("#endpoint-baseurl").addEventListener("input", function () {
      clearDiscoverNote(root);
      refreshEndpointForm(root);
    });
    root.querySelector("#endpoint-api").addEventListener("change", function () {
      // 只更新占位地址，保留管理员已经输入的地址。
      root.querySelector("#endpoint-baseurl").placeholder = apiBaseUrlPlaceholder(this.value);
      clearDiscoverNote(root);
      refreshEndpointForm(root);
    });

    // 输入方式切换：表单 ↔ JSON，两者互相转换，草稿不丢。
    root.querySelector("#endpoint-mode-form").addEventListener("click", function () {
      setEndpointMode(root, "form");
    });
    root.querySelector("#endpoint-mode-json").addEventListener("click", function () {
      setEndpointMode(root, "json");
    });
    root.querySelector("#endpoint-json").addEventListener("input", function () {
      // JSON 被手工改过：切回表单失败时保留这份草稿，不被表单序列化覆盖。
      root._endpointJSONPending = true;
      refreshEndpointForm(root);
    });
    // 填入 DeepSeek 示例：给用户一个可以直接改的起点。
    root.querySelector("#endpoint-json-example").addEventListener("click", function () {
      var ta = root.querySelector("#endpoint-json");
      ta.value = endpointJSONExample;
      root._endpointJSONPending = true;
      refreshEndpointForm(root);
    });
    // 表单被改过：表单重新成为唯一事实来源，下次切到 JSON 时按它序列化。
    root.querySelector("#endpoint-form-fields").addEventListener("input", function () {
      root._endpointJSONPending = false;
    });
    root.querySelector("#endpoint-form-fields").addEventListener("change", function () {
      root._endpointJSONPending = false;
    });

    // 用户 API Key 标签页：应用范围 / 用户勾选 / provider 变化只清内联错误。
    root.querySelector("#key-scope-all").addEventListener("click", function () {
      setKeyScope(root, true);
    });
    root.querySelector("#key-scope-pick").addEventListener("click", function () {
      setKeyScope(root, false);
    });
    root.querySelector("#key-pick-all").addEventListener("click", function () {
      setKeyPickedAll(root, true);
    });
    root.querySelector("#key-pick-none").addEventListener("click", function () {
      setKeyPickedAll(root, false);
    });
    root.querySelector("#key-provider-select").addEventListener("change", function () {
      root.querySelector("#key-error").textContent = "";
    });
    root.querySelector("#key-clear").addEventListener("click", clearKeyTab);
    root.querySelector("#key-ok").addEventListener("click", saveKeyTab);
    root.querySelector("#key-input").addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.keyCode === 13) {
        e.preventDefault();
        saveKeyTab();
      }
    });
    root.querySelector("#key-cancel").addEventListener("click", closeModelSettings);

    // 仅在遮罩上按下并松开时才关闭，避免在输入框内选中文字后拖到遮罩上误关闭。
    var overlayPressed = false;
    root.addEventListener("mousedown", function (e) {
      overlayPressed = e.target === root;
    });
    root.addEventListener("click", function (e) {
      if (e.target === root && overlayPressed) closeModelSettings();
    });
    document.addEventListener("keydown", onModelSettingsKeydown, true);

    document.body.appendChild(root);
    modelSettingsEl = root;
    root.querySelector("#endpoint-id").focus();
    // 初始化状态：表单为默认输入方式，Provider ID 提示、显示名称占位符，
    // 模型目录为空时保存按钮禁用。
    applyEndpointMode(root);
    root.querySelector("#endpoint-json").placeholder = endpointJSONExample;
    refreshEndpointForm(root);
    // 填充内置 / 自定义端点列表与「用户 API Key」的 provider 下拉；fetchProviders 失败时
    // 只用兜底列表，自定义端点列表显示空态。
    loadEndpoints(false);
  }

  // ---- 标签页 2：用户 API Key（批量：所有用户 / 指定用户） ----

  // keyTabUsers 是用户名列表；keyTabPicked 记录「指定用户」下的勾选（跨自动刷新保留）；
  // keyTabScopeAll 为真时目标范围是全部用户。
  var keyTabUsers = [];
  var keyTabPicked = {};
  var keyTabScopeAll = true;

  // loadKeyTabUsers 拉取 api/users 并重建勾选列表：新用户默认勾选，已删除的用户清掉选择，
  // 失败只写标签页内联错误。
  function loadKeyTabUsers() {
    var root = modelSettingsEl;
    if (!root) return;
    if (!root.querySelector("#key-user-list")) return;
    fetch("api/users")
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (data) {
        if (root !== modelSettingsEl) return; // 对话框已关闭或已重开，丢弃本次结果
        var users = (data && data.users) || [];
        keyTabUsers = users.map(function (u) { return u.name; });
        var known = {};
        keyTabUsers.forEach(function (name) {
          known[name] = true;
          if (!(name in keyTabPicked)) keyTabPicked[name] = true;
        });
        Object.keys(keyTabPicked).forEach(function (name) {
          if (!known[name]) delete keyTabPicked[name];
        });
        renderKeyUserList(root);
      })
      .catch(function (err) {
        if (root !== modelSettingsEl) return;
        var error = root.querySelector("#key-error");
        if (error) error.textContent = "读取用户列表失败：" + err.message;
      });
  }

  // renderKeyUserList 重建用户勾选列表并刷新计数。
  function renderKeyUserList(root) {
    var box = root.querySelector("#key-user-list");
    if (!box) return;
    box.innerHTML = "";
    if (keyTabUsers.length === 0) {
      box.innerHTML = '<div class="endpoint-empty">暂无用户</div>';
    } else {
      keyTabUsers.forEach(function (name) {
        var label = document.createElement("label");
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.value = name;
        cb.checked = keyTabPicked[name] === true;
        cb.addEventListener("change", function () {
          keyTabPicked[name] = cb.checked;
          updateKeyScopeCounts(root);
        });
        var span = document.createElement("span");
        span.textContent = name;
        label.appendChild(cb);
        label.appendChild(span);
        box.appendChild(label);
      });
    }
    updateKeyScopeCounts(root);
  }

  // updateKeyScopeCounts 刷新「所有用户（N）」、已选计数、列表显隐与按钮可用性。
  function updateKeyScopeCounts(root) {
    if (!root) return;
    var allCount = root.querySelector("#key-all-count");
    if (allCount) allCount.textContent = String(keyTabUsers.length);
    var picked = keyTabUsers.filter(function (n) { return keyTabPicked[n] === true; }).length;
    var pickCount = root.querySelector("#key-pick-count");
    if (pickCount) pickCount.textContent = "已选 " + picked + " / " + keyTabUsers.length + " 个用户";
    var picker = root.querySelector("#key-user-picker");
    if (picker) picker.hidden = keyTabScopeAll;
    var allBtn = root.querySelector("#key-scope-all");
    var pickBtn = root.querySelector("#key-scope-pick");
    if (allBtn) allBtn.setAttribute("aria-pressed", keyTabScopeAll ? "true" : "false");
    if (pickBtn) pickBtn.setAttribute("aria-pressed", keyTabScopeAll ? "false" : "true");
    var empty = keyTabUsers.length === 0 || (!keyTabScopeAll && picked === 0);
    var clearBtn = root.querySelector("#key-clear");
    if (clearBtn) clearBtn.disabled = empty;
    var okBtn = root.querySelector("#key-ok");
    if (okBtn) okBtn.disabled = empty || !root.querySelector("#key-provider-select").value;
  }

  function setKeyScope(root, all) {
    keyTabScopeAll = !!all;
    root.querySelector("#key-error").textContent = "";
    updateKeyScopeCounts(root);
  }

  function setKeyPickedAll(root, checked) {
    keyTabUsers.forEach(function (name) { keyTabPicked[name] = !!checked; });
    renderKeyUserList(root);
  }

  // selectedKeyTargets 返回本次操作的用户范围：全部用户返回空数组（后端把空 users 视为全部），
  // 指定用户返回已勾选的名字。
  function selectedKeyTargets() {
    if (keyTabScopeAll) return [];
    return keyTabUsers.filter(function (n) { return keyTabPicked[n] === true; });
  }

  // fillKeyProviderSelect 用 provider 列表重填 provider 下拉：自定义端点加「（自定义）」后缀。
  function fillKeyProviderSelect(list) {
    if (!modelSettingsEl) return;
    var select = modelSettingsEl.querySelector("#key-provider-select");
    if (!select) return;
    var prev = select.value;
    select.innerHTML = "";
    (list || []).forEach(function (p) {
      var opt = document.createElement("option");
      opt.value = p.id;
      opt.textContent = p.name + (p.custom ? "（自定义）" : "");
      select.appendChild(opt);
    });
    if (prev) select.value = prev;
    if (select.options.length && select.value === "") select.value = select.options[0].value;
    select.disabled = select.options.length === 0;
    updateKeyScopeCounts(modelSettingsEl);
  }

  // renderBatchResult 展示批量结果：一句汇总 + 失败明细。
  function renderBatchResult(root, data) {
    var box = root.querySelector("#key-result");
    if (!box) return;
    box.innerHTML = "";
    var summary = document.createElement("div");
    summary.className = "batch-summary";
    summary.textContent = (data && data.message) || "";
    box.appendChild(summary);
    var failed = (data && data.failed) || [];
    if (failed.length) {
      var ul = document.createElement("ul");
      ul.className = "batch-fail";
      failed.forEach(function (f) {
        var li = document.createElement("li");
        li.textContent = f.name + "：" + f.error;
        ul.appendChild(li);
      });
      box.appendChild(ul);
    }
  }

  // saveKeyTab 把同一个 Key 应用到所选范围（默认全部用户）：一次请求，逐用户反馈结果。
  function saveKeyTab() {
    var root = modelSettingsEl;
    if (!root) return;
    var providerSelect = root.querySelector("#key-provider-select");
    var input = root.querySelector("#key-input");
    var error = root.querySelector("#key-error");
    var btn = root.querySelector("#key-ok");
    if (!providerSelect || !input || !error || !btn) return;
    if (keyTabUsers.length === 0) {
      error.textContent = "用户列表尚未加载，请稍候…";
      return;
    }
    if (providerSelect.disabled || providerSelect.value === "") {
      error.textContent = "Provider 列表加载中，请稍候…";
      return;
    }
    var targets = selectedKeyTargets();
    if (!keyTabScopeAll && targets.length === 0) {
      error.textContent = "请至少勾选一个用户";
      return;
    }
    var key = input.value.trim();
    if (key === "") {
      error.textContent = "API Key 不能为空";
      input.focus();
      return;
    }
    error.textContent = "";
    btn.disabled = true;
    btn.textContent = "保存中…";
    fetch("api/apikeys", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ apiKey: key, providerId: providerSelect.value, users: targets })
    })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        if (root !== modelSettingsEl) return;
        if (input.value.trim() === key) input.value = "";
        renderBatchResult(root, j);
        showMsg(j.message || "Key 已应用");
        listUsers();
      })
      .catch(function (err) {
        if (root === modelSettingsEl) error.textContent = "应用失败：" + err.message;
        showMsg("应用 API Key 失败：" + err.message, true);
      })
      .finally(function () {
        btn.textContent = "保存到所选用户";
        updateKeyScopeCounts(root);
      });
  }

  // clearKeyTab 清除所选范围的专属 Key：一次请求，逐用户反馈结果。
  function clearKeyTab() {
    var root = modelSettingsEl;
    if (!root) return;
    var targets = selectedKeyTargets();
    var error = root.querySelector("#key-error");
    var btn = root.querySelector("#key-clear");
    if (!error || !btn) return;
    if (keyTabUsers.length === 0) {
      error.textContent = "用户列表尚未加载，请稍候…";
      return;
    }
    if (!keyTabScopeAll && targets.length === 0) {
      error.textContent = "请至少勾选一个用户";
      return;
    }
    var scopeText = keyTabScopeAll ? ("全部 " + keyTabUsers.length + " 个用户") : (targets.length + " 个所选用户");
    if (!window.confirm("确认清除 " + scopeText + " 的专属 API Key？\n" +
        "运行中的 agent 会退出对应 provider 登录；挂起的用户恢复后回退到内置/环境变量凭据。")) {
      return;
    }
    error.textContent = "";
    btn.disabled = true;
    btn.textContent = "清除中…";
    fetch("api/apikeys/clear", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ users: targets })
    })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        if (root !== modelSettingsEl) return;
        renderBatchResult(root, j);
        showMsg(j.message || "Key 已清除");
        listUsers();
      })
      .catch(function (err) {
        if (root === modelSettingsEl) error.textContent = "清除失败：" + err.message;
        showMsg("清除 API Key 失败：" + err.message, true);
      })
      .finally(function () {
        btn.textContent = "清除所选用户的 Key";
        updateKeyScopeCounts(root);
      });
  }

  // setUserExpiry prompts for an activation duration (e.g. "168h") and stores
  // it as the user's expiry; the server computes the absolute expiry timestamp.
  // A blank or "0"/"0h" input clears the expiry instead.
  function setUserExpiry(name) {
    var current = window.prompt(
      "为 \"" + name + "\" 设置激活有效期（到期后自动挂起释放资源，数据保留可恢复）。\n" +
      "输入持续时长，如 24h / 168h / 30m；输入 0 或留空表示清除。", "168h");
    if (current === null) {
      return; // 用户取消
    }
    var trimmed = current.trim();
    if (trimmed === "" || trimmed === "0" || /^0+[a-z]*$/i.test(trimmed)) {
      clearUserExpiry(name);
      return;
    }
    clearMsg();
    fetch("api/users/" + encodeURIComponent(name) + "/expiry", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ duration: trimmed })
    })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("用户 " + esc(j.name || name) + "：有效期限已设置，到期时间 " + (j.expiresAt || ""));
        listUsers();
      })
      .catch(function (err) {
        showMsg("设置有效期失败：" + err.message, true);
      });
  }

  function clearUserExpiry(name) {
    clearMsg();
    fetch("api/users/" + encodeURIComponent(name) + "/expiry", { method: "DELETE" })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("用户 " + esc(j.name || name) + "：" + (j.message || "有效期限已清除"));
        listUsers();
      })
      .catch(function (err) {
        showMsg("清除有效期失败：" + err.message, true);
      });
  }

  // setUserTier prompts for one of the fixed resource tiers (small/mid/large)
  // and stores it; it only affects the user's next fresh create/recreate.
  function setUserTier(name, currentTier) {
    var tier = window.prompt(
      "为 \"" + name + "\" 设置资源档位（small / mid / large）。\n" +
      "档位将在下次新建/重建该用户时生效（存量用户保持不变）。" +
      (currentTier ? "\n当前档位：" + currentTier : ""), currentTier || "small");
    if (tier === null) {
      return; // 用户取消
    }
    tier = tier.trim().toLowerCase();
    if (["small", "mid", "large"].indexOf(tier) === -1) {
      showMsg("非法资源档位：可选 small / mid / large", true);
      return;
    }
    clearMsg();
    fetch("api/users/" + encodeURIComponent(name) + "/tier", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tier: tier })
    })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("用户 " + esc(j.name || name) + "：" + (j.message || ("资源档位已设为 " + tier)));
        listUsers();
      })
      .catch(function (err) {
        showMsg("设置资源档位失败：" + err.message, true);
      });
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    // 回退方案：部分浏览器在非安全上下文（http）下禁用 Clipboard API。
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        ok ? resolve() : reject(new Error("复制失败"));
      } catch (e) {
        reject(e);
      }
    });
  }

  function copyPassword(name) {
    if (!window.confirm("确认重置用户 \"" + name + "\" 的访问密码并复制到剪贴板？旧密码将立即失效。")) {
      return;
    }
    clearMsg();
    fetch("api/users/" + encodeURIComponent(name) + "/password", { method: "POST" })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        return copyToClipboard(j.password).then(function () {
          showMsg("用户 " + esc(j.name) + " 的访问密码已生成并复制到剪贴板：" +
            j.password + "（仅显示一次）");
        }, function () {
          // 复制失败也照常显示，方便手动复制。
          showMsg("用户 " + esc(j.name) + " 的访问密码：" + j.password +
            "（已生成但自动复制失败，请手动复制）");
        });
      })
      .catch(function (err) {
        showMsg("复制密码失败：" + err.message, true);
      });
  }

  function resetPassword(name) {
    if (!window.confirm("确认重置用户 \"" + name + "\" 的访问密码？旧密码将立即失效。")) {
      return;
    }
    clearMsg();
    fetch("api/users/" + encodeURIComponent(name) + "/password", { method: "POST" })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("用户 " + esc(j.name) + " 的新访问密码：" + j.password +
          "（仅显示一次，请立即复制并告知用户）");
      })
      .catch(function (err) {
        showMsg("重置密码失败：" + err.message, true);
      });
  }

  function createUser(name) {
    clearMsg();
    fetch("api/users", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name })
    })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        var msg = "添加用户：" + (j.message || "成功");
        if (j.password) {
          msg += "；访问密码：" + j.password + "（仅显示一次，请立即复制并告知用户）";
        }
        showMsg(msg);
        document.getElementById("name-input").value = "";
        listUsers();
      })
      .catch(function (err) {
        showMsg("添加失败：" + err.message, true);
      });
  }

  // ---- 共享 Skills ----

  function fmtSize(bytes) {
    if (bytes == null || bytes < 0) return "—";
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(2) + " MB";
  }

  function fmtTime(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString();
  }

  function renderSkills(skills) {
    var table = document.getElementById("skill-table");
    var empty = document.getElementById("skill-empty");
    var body = document.getElementById("skill-body");
    body.innerHTML = "";
    if (!skills || skills.length === 0) {
      table.style.display = "none";
      empty.style.display = "block";
      return;
    }
    table.style.display = "table";
    empty.style.display = "none";
    skills.forEach(function (s) {
      var tr = document.createElement("tr");
      tr.innerHTML =
        '<td class="mono">' + esc(s.name) + "</td>" +
        "<td>" + esc(fmtSize(s.size)) + "</td>" +
        "<td>" + esc(fmtTime(s.updatedAt)) + "</td>" +
        '<td class="actions"><button class="danger mini skill-del" title="卸载该 skill（仅删除管理员托管的副本，不影响用户自建同名 skill）">删除</button></td>';
      tr.querySelector(".skill-del").addEventListener("click", function () {
        deleteSkill(s.name);
      });
      body.appendChild(tr);
    });
  }

  function listSkills() {
    fetch("api/skills")
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (data) {
        renderSkills(data.skills);
      })
      .catch(function (err) {
        showMsg("读取共享 Skills 失败：" + err.message, true);
      });
  }

  function uploadSkill(name, file) {
    clearMsg();
    var formData = new FormData();
    formData.append("name", name);
    formData.append("file", file, file.name);
    var btn = document.getElementById("skill-upload-btn");
    btn.disabled = true;
    btn.textContent = "上传中…";
    fetch("api/skills", { method: "POST", body: formData })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("已安装共享 Skill：" + (j.skill ? j.skill.name : name) +
          (j.skill && j.skill.size ? "（" + fmtSize(j.skill.size) + "）" : "") +
          "，约 10 秒内分发到所有用户");
        document.getElementById("skill-file-input").value = "";
        listSkills();
      })
      .catch(function (err) {
        showMsg("上传 Skill 失败：" + err.message, true);
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = "上传";
      });
  }

  function deleteSkill(name) {
    if (!window.confirm("确认卸载共享 Skill \"" + name + "\"？\n" +
        "将删除管理员托管的副本并通知所有用户移除；用户自建且未被托管的同名 skill 不会受影响。")) {
      return;
    }
    clearMsg();
    fetch("api/skills/" + encodeURIComponent(name), { method: "DELETE" })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        showMsg("已卸载共享 Skill：" + (j.message || name));
        listSkills();
      })
      .catch(function (err) {
        showMsg("卸载 Skill 失败：" + err.message, true);
      });
  }

  function applySkills() {
    clearMsg();
    var btn = document.getElementById("apply-skills-btn");
    var note = document.getElementById("apply-note");
    btn.disabled = true;
    btn.textContent = "应用中…";
    note.textContent = "";
    fetch("api/skills/apply", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}"
    })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error((j && j.error) || ("HTTP " + res.status));
          return j;
        });
      })
      .then(function (j) {
        if (j.error) {
          showMsg("立即应用失败：" + j.error, true);
          return;
        }
        var ok = j.failed === 0;
        showMsg("立即应用完成：已将新 Skill 应用到 " + j.reloaded + " 个在线会话（" +
          j.online + " 个在线用户）" + (j.failed > 0 ? "，" + j.failed + " 个用户未成功，将在下次开会话生效" : ""));
        if (j.failures && j.failures.length) {
          note.textContent = "未成功：" + j.failures.slice(0, 3).join("；") +
            (j.failures.length > 3 ? " 等" : "");
          note.style.color = "var(--danger)";
        } else {
          note.textContent = "已应用到 " + j.reloaded + "/" + j.online + " 个在线用户";
          note.style.color = "var(--green)";
        }
      })
      .catch(function (err) {
        showMsg("立即应用失败：" + err.message, true);
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = "立即应用";
      });
  }

  document.getElementById("skill-upload-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = document.getElementById("skill-name-input").value.trim();
    var fileInput = document.getElementById("skill-file-input");
    if (!/^[a-z0-9]([-a-z0-9]*[a-z0-9])?$/.test(name)) {
      showMsg("非法 skill 名称：必须匹配 DNS-1123（小写字母、数字、中划线）", true);
      return;
    }
    if (!fileInput.files || !fileInput.files[0]) {
      showMsg("请先选择要上传的 .tgz / .zip 文件", true);
      return;
    }
    uploadSkill(name, fileInput.files[0]);
  });

  document.getElementById("apply-skills-btn").addEventListener("click", applySkills);

  document.getElementById("add-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = document.getElementById("name-input");
    var name = input.value.trim();
    if (!/^[a-z0-9]([-a-z0-9]*[a-z0-9])?$/.test(name)) {
      showMsg("非法用户名：必须匹配 DNS-1123（小写字母、数字、中划线）", true);
      return;
    }
    createUser(name);
  });

  document.getElementById("refresh-btn").addEventListener("click", listUsers);
  document.getElementById("model-settings-btn").addEventListener("click", openModelSettings);

  // 点击其他区域时关闭已打开的下拉菜单。
  document.addEventListener("click", function () {
    closeAllDropdowns();
    openMenuUser = null;
  });

  // 滚动时关闭菜单：菜单为 fixed 定位，页面/卡片滚动后按钮位置会变化，
  // 留在原处的菜单会与按钮错位。
  window.addEventListener("scroll", function () {
    closeAllDropdowns();
    openMenuUser = null;
  }, true);

  listProviders();
  listUsers();
  listSkills();
  setInterval(listUsers, 5000);
})();
</script>
</body>
</html>
