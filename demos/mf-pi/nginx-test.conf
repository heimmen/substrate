# mf-pi multi-user reverse proxy (path-based) — TEST environment.
#
# Test-environment counterpart of nginx.conf. Listens on 59681 (prod: 58681),
# forwards to the atenet-router port-forward on 59880 and the mfpi-admin
# port-forward on 59882 (prod: 58680/58682), uses the mfpi_user_test cookie
# (prod: mfpi_user) and the mfpi-test atespace in the Host header (prod:
# mfpi). This file is bind-mounted over the image's baked-in conf by
# run-nginx-test.sh — it is NOT baked into the mfpi-nginx image.
#
# Each user is addressed by URL path:
#   http://<hostname>:59681/<username>
#
# See nginx.conf for the full routing/auth model; only the ports, cookie
# name, atespace and container-facing paths differ here.

server {
    listen 59681 default_server;
    server_name _;

    # Allow large request bodies (file uploads) through the proxy. nginx's
    # built-in default is 1m, which would reject pi-web uploads and the admin
    # UI's skill packages (.tgz/.zip; the admin itself accepts up to 64MiB per
    # archive) with 413 before they reach the backend. Keep this in the repo:
    # a hand-added conf.d snippet would be lost on the next image/container
    # rebuild. Must match nginx.conf.
    client_max_body_size 512m;

    # Landing page for the bare origin (no user id).
    location = / {
        default_type text/plain;
        return 200 "mf-pi multi-user proxy (TEST)\n\nAccess a user via URL path:\n  http://<hostname>:59681/<username>\n\nExample: http://localhost:59681/alice\n\nUser management UI:\n  http://<hostname>:59681/usermanagement/\n";
    }

    # Internal auth subrequest: validates the per-user password against the
    # mfpi-admin app (test namespace port-forward).
    location = /_mfpi_auth {
        internal;
        proxy_pass http://127.0.0.1:59882/_mfpi_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Mfpi-User $cookie_mfpi_user_test;
        proxy_set_header Authorization $http_authorization;
    }

    # Readiness gate: an auth subrequest that also refuses (403) while the
    # actor is not RUNNING. Unlike /_mfpi_auth it wakes a suspended actor in
    # the background and answers immediately, so the loading page can be shown
    # without waiting for the router's (multi-second) blocking resume.
    location = /_mfpi_gate {
        internal;
        proxy_pass http://127.0.0.1:59882/_mfpi_gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Mfpi-User $cookie_mfpi_user_test;
        proxy_set_header Authorization $http_authorization;
    }

    # User-management UI: a separate app pod (port-forward 59882), NOT a
    # user path.
    # Temporary CI/CD page (demo only): a host process (cicd_server.py, started
    # with ./cicd-server.sh start) runs demos/mf-pi/deploy.sh on the deploy host
    # and streams its output. Reached from the browser at /_cicd_ — the trailing
    # "/" in proxy_pass strips that prefix. Same Basic Auth as /usermanagement/.
    location = /_cicd_ {
        return 302 /_cicd_/;
    }
    location ^~ /_cicd_/ {
        auth_basic "mfpi admin";
        auth_basic_user_file /etc/nginx/mfpi-admin.htpasswd;
        proxy_pass http://127.0.0.1:59690/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        # The runner is not always up: say so instead of a bare 502.
        error_page 502 503 504 = @cicd_down;
    }
    location @cicd_down {
        default_type "text/plain; charset=utf-8";
        return 503 "mf-pi CI/CD service is not running.\nStart it on the deploy host:  demos/mf-pi/cicd-server.sh start\n";
    }

    location ^~ /usermanagement/ {
        auth_basic "mfpi admin";
        auth_basic_user_file /etc/nginx/mfpi-admin.htpasswd;
        proxy_pass http://127.0.0.1:59882/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User entry: /<username> -> set cookie and normalize to /<username>/.
    location ~ ^/(?<username>[a-z0-9-]+)$ {
        add_header Set-Cookie "mfpi_user_test=$username; Path=/; HttpOnly; SameSite=Lax" always;
        return 302 /$username/$is_args$args;
    }

    # User-scoped path: /<username>/<rest...> -> set cookie, strip prefix,
    # proxy (Host: <username>.mfpi-test.actors...).
    #
    # /_mfpi_gate refuses (403) while the actor is not RUNNING; that 403 is
    # turned into the "agent is loading" page for browsers, and into a raw 503
    # for API/WebSocket clients (see /_mfpi_loading). While the actor is
    # RUNNING but its web server is still booting, upstream 503 is mapped to
    # the loading page; 502/504 (tunnel/router down) get a hard error page.
    location ~ ^/(?<username>[a-z0-9-]+)/(?<rest>.*)$ {
        auth_request /_mfpi_gate;
        # The auth subrequest cannot set cookies (nginx drops its headers), so the
        # admin returns the "stay signed in" cookie as a header and we forward it
        # on the real response. Empty values are not emitted, so requests that
        # authenticated via cookie alone do not churn Set-Cookie.
        auth_request_set $mfpi_auth_cookie $upstream_http_x_mfpi_auth_cookie;
        add_header Set-Cookie $mfpi_auth_cookie always;
        add_header Set-Cookie "mfpi_user_test=$username; Path=/; HttpOnly; SameSite=Lax" always;
        proxy_intercept_errors on;
        # 403/503: the router is reachable but the actor is not ready yet
        # (resuming/booting) -> friendly loading page.
        error_page 403 503 = /_mfpi_loading;
        # 502/504: the gateway cannot reach the router at all (dead
        # port-forward, router down). Show a hard, visible error instead of an
        # endless loading page; the page retries every 10s.
        error_page 502 504 = @mfpi_gateway_down;
        proxy_pass http://127.0.0.1:59880/$rest$is_args$args;
        proxy_set_header Host $username.mfpi-test.actors.resources.substrate.ate.dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reached when the gateway cannot reach the router at all (502/504). This
    # is an operator problem (port-forward/router), not the user's account, so
    # say so loudly instead of showing the "agent is loading" page forever.
    location @mfpi_gateway_down {
        default_type "text/html; charset=utf-8";
        return 502 '<!doctype html><html><head><meta charset="utf-8"><title>Agent 网关不可用</title><meta http-equiv="refresh" content="10"></head><body style="font-family:sans-serif;padding:2rem;line-height:1.7"><h1>Agent 网关连接失败（502）</h1><p>浏览器到 Agent 路由的隧道不可用，<b>不是你的账号或 Agent 的问题</b>。</p><p>请联系管理员检查 router 的 port-forward；本页 10 秒后自动重试。</p></body></html>';
    }

    # Loading interstitial target (reached only via error_page above). Serves
    # the friendly page for browsers, and the original 503 for everything else
    # so API/WebSocket clients see the truth.
    location = /_mfpi_loading {
        internal;
        if ($http_accept !~* "text/html") {
            return 503;
        }
        proxy_pass http://127.0.0.1:59882/_mfpi_loading;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Mfpi-User $cookie_mfpi_user_test;
    }

    # Fallback: favicon, /app-icon.svg, etc. -> route by cookie.
    location / {
        auth_request /_mfpi_auth;
        proxy_pass http://127.0.0.1:59880;
        proxy_set_header Host $cookie_mfpi_user_test.mfpi-test.actors.resources.substrate.ate.dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
