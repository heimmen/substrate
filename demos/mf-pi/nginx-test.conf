# mf-pi multi-user reverse proxy (path-based) — TEST environment.
#
# Test-environment counterpart of nginx.conf. Listens on 59881 (prod: 58681),
# forwards to the atenet-router port-forward on 59880 and the mfpi-admin
# port-forward on 59882 (prod: 58680/58682), uses the mfpi_user_test cookie
# (prod: mfpi_user) and the mfpi-test atespace in the Host header (prod:
# mfpi). This file is bind-mounted over the image's baked-in conf by
# run-nginx-test.sh — it is NOT baked into the mfpi-nginx image.
#
# Each user is addressed by URL path:
#   http://<hostname>:59881/<username>
#
# See nginx.conf for the full routing/auth model; only the ports, cookie
# name, atespace and container-facing paths differ here.

server {
    listen 59881 default_server;
    server_name _;

    # Landing page for the bare origin (no user id).
    location = / {
        default_type text/plain;
        return 200 "mf-pi multi-user proxy (TEST)\n\nAccess a user via URL path:\n  http://<hostname>:59881/<username>\n\nExample: http://localhost:59881/alice\n\nUser management UI:\n  http://<hostname>:59881/usermanagement/\n";
    }

    # Internal auth subrequest: validates the per-user password against the
    # mfpi-admin app (test namespace port-forward).
    location = /_mfpi_auth {
        internal;
        proxy_pass http://127.0.0.1:59882/_mfpi_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Mfpi-User $cookie_mfpi_user_test;
        proxy_set_header Authorization $http_authorization;
    }

    # User-management UI: a separate app pod (port-forward 59882), NOT a
    # user path.
    location ^~ /usermanagement/ {
        auth_basic "mfpi admin";
        auth_basic_user_file /etc/nginx/mfpi-admin.htpasswd;
        proxy_pass http://127.0.0.1:59882/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User entry: /<username> -> set cookie and normalize to /<username>/.
    location ~ ^/(?<username>[a-z0-9-]+)$ {
        add_header Set-Cookie "mfpi_user_test=$username; Path=/; HttpOnly; SameSite=Lax" always;
        return 302 /$username/$is_args$args;
    }

    # User-scoped path: /<username>/<rest...> -> set cookie, strip prefix,
    # proxy (Host: <username>.mfpi-test.actors...).
    location ~ ^/(?<username>[a-z0-9-]+)/(?<rest>.*)$ {
        auth_request /_mfpi_auth;
        add_header Set-Cookie "mfpi_user_test=$username; Path=/; HttpOnly; SameSite=Lax" always;
        proxy_pass http://127.0.0.1:59880/$rest$is_args$args;
        proxy_set_header Host $username.mfpi-test.actors.resources.substrate.ate.dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback: favicon, /app-icon.svg, etc. -> route by cookie.
    location / {
        auth_request /_mfpi_auth;
        proxy_pass http://127.0.0.1:59880;
        proxy_set_header Host $cookie_mfpi_user_test.mfpi-test.actors.resources.substrate.ate.dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
